            {/* Hourly chart */}
            <div style={{ marginTop: 20 }}>
              <div style={{ fontSize: 10, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: COLORS.inkMute, marginBottom: 8 }}>
                Reading hours
              </div>
              <HourChart hourly={selected.hourly} color={selectedBadge.color} height={180} />
            </div>
          </section>
        ) : (
          <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.rule}`, padding: 40, textAlign: "center", color: COLORS.inkMute, fontFamily: FONT_LATIN, fontStyle: "italic" }}>
            Select a story to see plot analysis.
          </div>
        )}
      </div>

      {/* Action insights */}
      <div style={{ marginTop: 32, padding: "24px 28px", background: COLORS.surface, border: `1px solid ${COLORS.rule}`, borderRadius: 2 }}>
        <SectionHead title="Impact takeaways" italic="what to do with this" />
        <ul style={{ margin: 0, paddingLeft: 20, fontSize: 13, fontFamily: FONT_LATIN, color: COLORS.ink, lineHeight: 1.9 }}>
          <li><strong style={{ color: COLORS.burgundy }}>Bedtime is a major use-case.</strong> {(data.bedtimeSummary.bedtimeShareOverall*100).toFixed(0)}% of reads happen in the evening window — schedule a "Tonight's Story" carousel that surfaces high bedtime-share titles automatically after 18:00.</li>
          <li><strong style={{ color: COLORS.burgundy }}>The strong-bedtime tail is under-discovered.</strong> Many top-share stories (الأرانب الثلاثة, القدر السحري, علاء الدين) have outsized bedtime affinity but modest reads. Discovery, not content, is the bottleneck.</li>
          <li><strong style={{ color: COLORS.burgundy }}>The pattern points to a content recipe.</strong> Animal protagonists, simple resolution arcs, classic-fairy-tale recognition, and gentle-stakes plots dominate the strong-bedtime list. Use this lens when commissioning new content.</li>
          <li><strong style={{ color: COLORS.burgundy }}>Daytime readers want different things.</strong> Stories like سندباد and الأمير والفقير index toward daytime — longer adventures, more complex social dynamics. They're not failed bedtime stories; they're a separate product.</li>
        </ul>
      </div>

      {/* Method note */}
      <div style={{ marginTop: 16, fontSize: 11, color: COLORS.inkMute, fontFamily: FONT_UI, lineHeight: 1.7 }}>
        <strong style={{ color: COLORS.inkSoft, fontWeight: 600, letterSpacing: "0.06em" }}>Method · </strong>
        Bedtime window = 19:00–02:00 KSA (UTC+3), i.e. UTC hours 16–23. Bedtime share = reads in window ÷ total reads, where each read is a StoryView event with <em>createdAt</em> in the window. Stories with fewer than 5 total reads are marked insufficient and excluded from the bedtime classification. Plot analysis text is curated qualitative commentary — it reflects content patterns we see in high-share titles, not automated NLP.
      </div>
    </main>
  );
}

function TagsTab({ data }) {
  const [polarity, setPolarity] = useState("all");
  const [sortKey, setSortKey] = useState("totalReads");

  const filtered = useMemo(() => {
    let t = data.tags;
    if (polarity !== "all") t = t.filter(x => x.polarity === polarity);
    return [...t].sort((a, b) => (b[sortKey] || 0) - (a[sortKey] || 0));
  }, [data.tags, polarity, sortKey]);

  const positives = data.tags.filter(t => t.polarity === "positive");
  const negatives = data.tags.filter(t => t.polarity === "negative");
  const totalPosReads = positives.reduce((a, t) => a + t.totalReads, 0);
  const totalNegReads = negatives.reduce((a, t) => a + t.totalReads, 0);

  const TAG_SORTS = [
    { key: "totalReads", label: "Reads" },
    { key: "uniqueReaders", label: "Readers" },
    { key: "storyCount", label: "Stories" },
    { key: "avgRating", label: "Rating" },
  ];

  const maxValue = Math.max(...filtered.map(t => t[sortKey] || 0), 1);

  return (
    <main style={{ maxWidth: 1320, margin: "0 auto", padding: "32px 32px 60px" }}>
      <SectionHead title="Manner Tags" italic="what readers actually engage with"
        right={<div style={{ fontSize: 11, fontFamily: FONT_MONO, color: COLORS.inkMute, letterSpacing: "0.08em" }}>{data.tags.length} UNIQUE TAGS</div>} />
      <Ornament />

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 0, marginTop: 20, border: `1px solid ${COLORS.rule}`, background: COLORS.surface, borderRadius: 2 }}>
        <DetailKpi label="Positive Tags" value={positives.length} sub={`${totalPosReads.toLocaleString()} reads across them`} accent={COLORS.sage} primary />
        <DetailKpi label="Negative Tags" value={negatives.length} sub={`${totalNegReads.toLocaleString()} reads across them`} accent={COLORS.saffron} />
        <DetailKpi label="Top Virtue" value={positives[0] ? positives.sort((a,b)=>b.totalReads-a.totalReads)[0].tag : "—"} sub={positives[0] ? `${positives.sort((a,b)=>b.totalReads-a.totalReads)[0].totalReads} reads` : ""} accent={COLORS.ink}
          extra={positives[0] && <div style={{marginTop:6}}><ArabicText size={20} color={COLORS.sage} weight={700}>{positives.sort((a,b)=>b.totalReads-a.totalReads)[0].tag}</ArabicText></div>} />
        <DetailKpi label="Top Vice" value={negatives[0] ? negatives.sort((a,b)=>b.totalReads-a.totalReads)[0].tag : "—"} sub={negatives[0] ? `${negatives.sort((a,b)=>b.totalReads-a.totalReads)[0].totalReads} reads` : ""} accent={COLORS.ink}
          extra={negatives[0] && <div style={{marginTop:6}}><ArabicText size={20} color={COLORS.saffron} weight={700}>{negatives.sort((a,b)=>b.totalReads-a.totalReads)[0].tag}</ArabicText></div>} />
      </div>

      {/* Filters */}
      <div style={{ marginTop: 28, display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 16 }}>
        <div style={{ display: "flex", gap: 4 }}>
          {[
            { k: "all", label: "All Tags", c: COLORS.ink },
            { k: "positive", label: "Virtues", c: COLORS.sage },
            { k: "negative", label: "Vices", c: COLORS.saffron },
          ].map(opt => (
            <button key={opt.k} onClick={() => setPolarity(opt.k)} className="tab-btn"
              style={{ background: "transparent", border: "none", cursor: "pointer", padding: "6px 12px",
                fontFamily: FONT_UI, fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase",
                color: polarity === opt.k ? opt.c : COLORS.inkSoft,
                borderBottom: `2px solid ${polarity === opt.k ? opt.c : "transparent"}` }}>
              {opt.label}
            </button>
          ))}
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 4, fontSize: 10, fontFamily: FONT_UI }}>
          <span style={{ color: COLORS.inkMute, marginRight: 4, alignSelf: "center", letterSpacing: "0.12em", textTransform: "uppercase" }}>Sort</span>
          {TAG_SORTS.map((s) => (
            <button key={s.key} onClick={() => setSortKey(s.key)} className="tab-btn"
              style={{ background: "transparent", border: "none", cursor: "pointer", padding: "4px 8px",
                fontFamily: FONT_UI, fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase",
                color: sortKey === s.key ? COLORS.saffron : COLORS.inkSoft,
                borderBottom: `1px solid ${sortKey === s.key ? COLORS.saffron : "transparent"}` }}>
              {s.label}
            </button>
          ))}
        </div>
      </div>

      {/* Tag list */}
      <div style={{ marginTop: 16, background: COLORS.surface, border: `1px solid ${COLORS.rule}`, borderRadius: 2 }}>
        {/* Column headers */}
        <div style={{ display: "grid", gridTemplateColumns: "32px minmax(160px, 1.2fr) 60px 70px 80px 80px 1.6fr",
          padding: "12px 18px", borderBottom: `1px solid ${COLORS.rule}`, fontSize: 10, fontFamily: FONT_UI,
          color: COLORS.inkMute, letterSpacing: "0.16em", textTransform: "uppercase", gap: 12 }}>
          <span>#</span><span>Tag</span><span style={{textAlign:"right"}}>Stories</span><span style={{textAlign:"right"}}>Readers</span><span style={{textAlign:"right"}}>Reads</span><span style={{textAlign:"right"}}>Rating</span><span>Top story</span>
        </div>
        <div className="scrollY" style={{ maxHeight: "60vh", overflowY: "auto" }}>
          {filtered.map((t, i) => {
            const value = t[sortKey] || 0;
            const barPct = (value / maxValue) * 100;
            return (
              <div key={`${t.polarity}-${t.tag}`} className="row-hover"
                style={{ display: "grid", gridTemplateColumns: "32px minmax(160px, 1.2fr) 60px 70px 80px 80px 1.6fr",
                  padding: "12px 18px", borderBottom: `1px solid ${COLORS.ruleSoft}`, alignItems: "center", gap: 12,
                  position: "relative", overflow: "hidden" }}>
                <span style={{ position: "absolute", left: 0, top: 0, bottom: 0,
                  width: `${barPct}%`, background: t.polarity === "positive" ? COLORS.sage : COLORS.saffron,
                  opacity: 0.07, pointerEvents: "none" }} />
                <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: COLORS.inkMute, position: "relative" }}>{pad2(i + 1)}</span>
                <span style={{ position: "relative", display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ width: 6, height: 6, borderRadius: "50%", background: t.polarity === "positive" ? COLORS.sage : COLORS.saffron, flexShrink: 0 }} />
                  <ArabicText size={20} weight={600}>{t.tag}</ArabicText>
                </span>
                <span style={{ textAlign: "right", fontFamily: FONT_MONO, fontSize: 12, color: COLORS.inkSoft, position: "relative" }}>{t.storyCount}</span>
                <span style={{ textAlign: "right", fontFamily: FONT_MONO, fontSize: 12, color: COLORS.inkSoft, position: "relative" }}>{t.uniqueReaders}</span>
                <span style={{ textAlign: "right", fontFamily: FONT_MONO, fontSize: 13, color: COLORS.ink, fontWeight: 500, position: "relative" }}>{t.totalReads.toLocaleString()}</span>
                <span style={{ textAlign: "right", fontFamily: FONT_MONO, fontSize: 12, color: t.avgRating ? COLORS.gold : COLORS.inkMute, position: "relative" }}>
                  {t.avgRating ? `${t.avgRating.toFixed(1)}★` : "—"}
                </span>
                <span style={{ position: "relative", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                  {t.topStories[0] && (
                    <ArabicText size={14} color={COLORS.inkSoft} weight={400}>
                      {t.topStories[0].title} <span style={{fontFamily:FONT_MONO, fontSize:10, color:COLORS.inkMute}}>· {t.topStories[0].reads}</span>
                    </ArabicText>
                  )}
                </span>
              </div>
            );
          })}
        </div>
      </div>

      <div style={{ marginTop: 24, fontSize: 11, color: COLORS.inkMute, fontFamily: FONT_UI, lineHeight: 1.7 }}>
        <strong style={{ color: COLORS.inkSoft, fontWeight: 600, letterSpacing: "0.06em" }}>How to read · </strong>
        Reads and Readers are aggregated across all stories carrying the tag. A story with two virtues counts toward both. The shaded bar shows the tag's value relative to the chart's maximum on the active sort. <em>Recommendation:</em> stories carrying high-read tags with few existing entries (top right) are content gaps worth filling; tags with many stories but low reads/rating (long tail) may be over-produced.
      </div>
    </main>
  );
}

    Expirations: -m.EXPIRATION,

  const activeChartData = rev.activeByMonth.map(m => ({
    month: m.month.slice(2),
    active: m.active,
  }));

  const productMix = Object.entries(rev.products).map(([k, v]) => ({ name: k, value: v }));
  const storeMix = Object.entries(rev.stores).map(([k, v]) => ({ name: k, value: v }));

                <div key={s.label} style={{ marginBottom: i < funnelStages.length - 1 ? 18 : 0 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6, fontFamily: FONT_UI, fontSize: 12 }}>
                    <span style={{ color: COLORS.inkSoft, fontWeight: 500 }}>{s.label}</span>
                    <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: COLORS.inkMute }}>
                      {s.count.toLocaleString()} <span style={{ color: COLORS.inkMute }}>· {pct(s.count, maxFunnel)}</span>
                    </span>
                  </div>
                  <div style={{ height: 8, background: COLORS.bg, borderRadius: 1, position: "relative", overflow: "hidden" }}>
                    <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: `${w}%`,
                      background: i === 0 ? COLORS.ink : i === funnelStages.length - 1 ? COLORS.sage : COLORS.gold,
                      transition: "width 400ms ease" }} />
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        <div>
          <SectionHead title="Mix" italic="store · product · currency" />
          <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.rule}`, borderRadius: 2, padding: "20px 24px" }}>
            <MixBlock title="By store" items={storeMix} colors={[COLORS.sage, COLORS.saffron, COLORS.gold]} />
            <div style={{ height: 1, background: COLORS.ruleSoft, margin: "16px 0" }} />
            <MixBlock title="By product type" items={productMix} colors={[COLORS.blue, COLORS.gold, COLORS.saffron, COLORS.sage]} />
            <div style={{ height: 1, background: COLORS.ruleSoft, margin: "16px 0" }} />
            <div>
              <div style={{ fontSize: 10, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: COLORS.inkMute, marginBottom: 12 }}>
                Revenue by currency
              </div>
              {Object.entries(rev.currencyTotals).sort((a,b)=>b[1]-a[1]).map(([cur, val]) => (
                <div key={cur} style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8, fontFamily: FONT_MONO, fontSize: 13 }}>
                  <span style={{ color: COLORS.inkSoft, fontWeight: 500 }}>{cur}</span>
                  <span style={{ color: COLORS.ink, fontVariantNumeric: "tabular-nums" }}>
                    {val.toLocaleString(undefined, { maximumFractionDigits: 2 })}
                  </span>
                </div>
              ))}
              <div style={{ marginTop: 8, fontSize: 10, color: COLORS.inkMute, fontFamily: FONT_UI, lineHeight: 1.5 }}>
                Multi-currency totals are not summed — exchange rates fluctuate.
              </div>
            </div>
          </div>
        </div>
      </div>

      <div style={{ marginTop: 28, fontSize: 11, color: COLORS.inkMute, fontFamily: FONT_UI, lineHeight: 1.7 }}>
        <strong style={{ color: COLORS.inkSoft, fontWeight: 600, letterSpacing: "0.06em" }}>Caveats · </strong>
        "Active Subscribers" is taken from User.<em>subscription_plan</em> at backup time, while monthly active series infers status from RevenueCat event order (last relevant event ≤ month-end). Trial conversion looks for any NORMAL purchase/renewal by users who had a TRIAL event. Funnel windows are days between User.<em>createdAt</em> and earliest INITIAL_PURCHASE record for that user.
      </div>
    </main>
  );
}

function MixBlock({ title, items, colors }) {
  const total = items.reduce((a, x) => a + x.value, 0);
  return (
    <div>
      <div style={{ fontSize: 10, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: COLORS.inkMute, marginBottom: 12 }}>
        {title}
      </div>
      <div style={{ display: "flex", height: 8, borderRadius: 1, overflow: "hidden", marginBottom: 10, background: COLORS.bg }}>
        {items.map((it, i) => (
          <div key={it.name} style={{ width: `${100*it.value/total}%`, background: colors[i % colors.length] }} />
        ))}
      </div>
      {items.map((it, i) => (
        <div key={it.name} style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6, fontFamily: FONT_MONO, fontSize: 12 }}>
          <span style={{ display: "flex", alignItems: "center", gap: 6, color: COLORS.inkSoft }}>
            <span style={{ width: 8, height: 8, background: colors[i % colors.length], borderRadius: 1 }} />
            {it.name}
          </span>
          <span style={{ color: COLORS.ink, fontVariantNumeric: "tabular-nums" }}>{it.value.toLocaleString()} <span style={{color:COLORS.inkMute}}>· {pct(it.value, total)}</span></span>
        </div>
      ))}
    </div>
  );
}

/* =========================================================================== */
/*   APP                                                                       */
/* =========================================================================== */
const TABS = [
  { key: "stories", label: "Stories" },
  { key: "bedtime", label: "Bedtime" },
  { key: "tags", label: "Manner Tags" },
  { key: "readers", label: "Readers" },
  { key: "revenue", label: "Revenue" },
];

function App() {
  const [data, setData] = useState(RAW_DATA);
  const [tab, setTab] = useState("stories");
  const [uploadStatus, setUploadStatus] = useState(null); // {type, msg, count}
  const fileInputRef = React.useRef(null);
  const totals = data.totals;
  const peakHourGlobal = totals.aggregateHourly.indexOf(Math.max(...totals.aggregateHourly));

  // Recompute aggregate fields from a stories array — keeps totals/categories in sync after merge
  const recomputeAggregates = (stories, baseData) => {
    const TYPE_LABELS = baseData.categories?.typeLabels || {};
    const AGE_LABELS = baseData.categories?.ageLabels || {};

    // Hourly aggregation
    const aggregateHourly = Array(24).fill(0);
    let totalReads = 0, totalRatings = 0, ratingSum = 0, totalDuration = 0, totalOpens = 0, totalSessions = 0;
    const readerSet = new Set();
    stories.forEach(s => {
      if (Array.isArray(s.hourly)) s.hourly.forEach((v, h) => { aggregateHourly[h] += v || 0; });
      totalReads += s.reads || 0;
      totalOpens += s.opens || 0;
      totalSessions += s.sessions || 0;
      totalDuration += s.totalDuration || 0;
      if (s.ratingCount > 0) { ratingSum += s.avgRating * s.ratingCount; totalRatings += s.ratingCount; }
      // We can't reconstruct unique readers across stories without raw view IDs; sum is a fallback
    });

    // Categories aggregation
    const cell = {}, byType = {}, byAge = {};
    stories.filter(s => s.ageGroup && s.storyType).forEach(s => {
      const ck = `${s.ageGroup}|${s.storyType}`;
      (cell[ck] = cell[ck] || []).push(s);
      (byType[s.storyType] = byType[s.storyType] || []).push(s);
      (byAge[s.ageGroup] = byAge[s.ageGroup] || []).push(s);
    });
    const statsFor = (group) => {
      if (!group || group.length === 0) return null;
      const reads = group.map(g => g.reads);
      const ratings = group.filter(g => g.ratingCount > 0);
      const weight = ratings.reduce((a, g) => a + g.ratingCount, 0);
      return {
        count: group.length,
        totalReads: reads.reduce((a, b) => a + b, 0),
        avgReads: reads.reduce((a, b) => a + b, 0) / group.length,
        medianReads: reads.slice().sort((a, b) => a - b)[Math.floor(reads.length / 2)] || 0,
        avgRating: weight > 0 ? ratings.reduce((a, g) => a + g.avgRating * g.ratingCount, 0) / weight : 0,
        totalRatings: weight,
        topTitle: group.slice().sort((a, b) => b.reads - a.reads)[0]?.title,
      };
    };

    // Recompute per-story rank fields from merged set
    stories.forEach(s => {
      if (!s.ageGroup || !s.storyType) {
        s.categoryRank = s.categorySize = s.categoryAvgReads = null;
        s.typeRank = s.typeSize = s.typeAvgReads = null;
        return;
      }
      const cg = cell[`${s.ageGroup}|${s.storyType}`] || [];
      const cgSorted = cg.slice().sort((a, b) => b.reads - a.reads);
      s.categoryRank = cgSorted.findIndex(x => x.id === s.id) + 1;
      s.categorySize = cg.length;
      s.categoryAvgReads = cg.reduce((a, x) => a + x.reads, 0) / Math.max(cg.length, 1);
      const tg = byType[s.storyType] || [];
      const tgSorted = tg.slice().sort((a, b) => b.reads - a.reads);
      s.typeRank = tgSorted.findIndex(x => x.id === s.id) + 1;
      s.typeSize = tg.length;
      s.typeAvgReads = tg.reduce((a, x) => a + x.reads, 0) / Math.max(tg.length, 1);
    });

    // Find max lastReadTs across merged set as the "now anchor"
    const maxReadTs = Math.max(0, ...stories.map(s => s.lastReadTs || 0));
    const dataMaxReadAt = maxReadTs > 0 ? new Date(maxReadTs).toISOString() : baseData.dataMaxReadAt;

    return {
      ...baseData,
      stories,
      dataMaxReadAt,
      totals: {
        ...baseData.totals,
        storyCount: stories.length,
        totalReads,
        totalOpens,
        totalSessions,
        totalDuration,
        avgRatingOverall: totalRatings > 0 ? ratingSum / totalRatings : 0,
        totalRatings,
        aggregateHourly,
      },
      categories: {
        typeLabels: TYPE_LABELS,
        ageLabels: AGE_LABELS,
        byAge: Object.fromEntries(Object.entries(byAge).map(([k, v]) => [k, statsFor(v)])),
        byType: Object.fromEntries(Object.entries(byType).map(([k, v]) => [k, statsFor(v)])),
        byCell: Object.fromEntries(Object.entries(cell).map(([k, v]) => [k, statsFor(v)])),
      },
    };
  };

  // Merge incoming dataset into current — replace stories by id, add new ones
  const handleUpload = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const incoming = JSON.parse(e.target.result);
        if (!incoming || !Array.isArray(incoming.stories)) {
          throw new Error("Invalid format — expected dashboard JSON with 'stories' array.");
        }
        const existingById = new Map(data.stories.map(s => [s.id, s]));
        let updatedCount = 0, newCount = 0;
        incoming.stories.forEach(s => {
          if (existingById.has(s.id)) updatedCount++;
          else newCount++;
          existingById.set(s.id, s);
        });
        const mergedStories = Array.from(existingById.values());
        const merged = recomputeAggregates(mergedStories, {
          ...data,
          // Prefer incoming totals fields like trackingNotes, guests/registered counts (latest snapshot)
          totals: { ...data.totals, ...incoming.totals },
          revenue: incoming.revenue || data.revenue,
          readers: incoming.readers || data.readers,
          mannerTags: incoming.mannerTags || data.mannerTags,
          tags: incoming.tags || data.tags,
        });
        setData(merged);
        setUploadStatus({
          type: "success",
          msg: `Merged · ${newCount} new · ${updatedCount} updated · ${mergedStories.length} total stories`,
        });
        setTimeout(() => setUploadStatus(null), 8000);
      } catch (err) {
        setUploadStatus({ type: "error", msg: err.message || "Failed to parse file." });
        setTimeout(() => setUploadStatus(null), 8000);
      }
    };
    reader.onerror = () => {
      setUploadStatus({ type: "error", msg: "Could not read file." });
      setTimeout(() => setUploadStatus(null), 6000);
    };
    reader.readAsText(file);
  };

  // Allow user to download current state for safekeeping/sharing
  const handleDownload = () => {
    const payload = JSON.stringify(data, null, 2);
    const blob = new Blob([payload], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const today = new Date().toISOString().slice(0, 10);
    a.download = `bostan_dashboard_${today}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  return (
    <div style={{ minHeight: "100vh", background: COLORS.bg, color: COLORS.ink, fontFamily: FONT_UI }}>
      <style dangerouslySetInnerHTML={{ __html: fontImportCss }} />

      <header style={{ borderBottom: `1px solid ${COLORS.rule}`, background: COLORS.surface }}>
        <div style={{ maxWidth: 1320, margin: "0 auto", padding: "24px 32px 0", display: "flex", alignItems: "flex-end", justifyContent: "space-between", flexWrap: "wrap", gap: 16 }}>
          <div>
            <div style={{ display: "flex", alignItems: "baseline", gap: 14 }}>
              <h1 style={{ margin: 0, fontFamily: FONT_LATIN, fontWeight: 500, fontSize: 36, letterSpacing: "-0.02em" }}>Bostan</h1>
              <span dir="rtl" lang="ar" style={{ fontFamily: FONT_ARABIC, fontSize: 26, color: COLORS.saffron }}>بستان</span>
            </div>
            <div style={{ marginTop: 6, fontSize: 12, letterSpacing: "0.22em", textTransform: "uppercase", color: COLORS.inkMute }}>
              Story Analytics · {totals.storyCount} stories · {totals.totalUsers} users
            </div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 10 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, fontFamily: FONT_MONO, fontSize: 11, color: COLORS.inkMute }}>
              <span style={{ width: 6, height: 6, borderRadius: "50%", background: COLORS.sage }} />
              backup snapshot · views since {totals.trackingNotes?.viewStart || "—"} · opens since {totals.trackingNotes?.openStart || "—"}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <input ref={fileInputRef} type="file" accept=".json,application/json"
                onChange={(e) => { handleUpload(e.target.files?.[0]); e.target.value = ""; }}
                style={{ display: "none" }} />
              <button onClick={() => fileInputRef.current?.click()}
                style={{ background: COLORS.surfaceAlt, border: `1px solid ${COLORS.rule}`, borderRadius: 2,
                  padding: "7px 14px", cursor: "pointer", fontFamily: FONT_UI, fontSize: 11,
                  letterSpacing: "0.12em", textTransform: "uppercase", color: COLORS.ink, fontWeight: 500 }}>
                ↑ Upload backup
              </button>
              <button onClick={handleDownload}
                title="Export current state as JSON"
                style={{ background: "transparent", border: `1px solid ${COLORS.ruleSoft}`, borderRadius: 2,
                  padding: "7px 12px", cursor: "pointer", fontFamily: FONT_UI, fontSize: 11,
                  letterSpacing: "0.12em", textTransform: "uppercase", color: COLORS.inkSoft }}>
                ↓ Export
              </button>
            </div>
            {uploadStatus && (
              <div style={{
                fontFamily: FONT_MONO, fontSize: 11, padding: "6px 12px", borderRadius: 2,
                background: uploadStatus.type === "success" ? "rgba(63,107,58,0.08)" : "rgba(182,57,28,0.08)",
                color: uploadStatus.type === "success" ? COLORS.sage : COLORS.saffron,
                border: `1px solid ${uploadStatus.type === "success" ? COLORS.sage : COLORS.saffron}`,
                animation: "fadeUp 240ms ease-out",
              }}>
                {uploadStatus.type === "success" ? "✓ " : "✗ "}{uploadStatus.msg}
              </div>
            )}
          </div>
        </div>

        {/* KPI strip */}
        <div style={{ maxWidth: 1320, margin: "0 auto", marginTop: 24, borderTop: `1px solid ${COLORS.rule}`, display: "flex", flexWrap: "wrap" }}>
          <Kpi label="Reads" value={totals.totalReads.toLocaleString()} sub="StoryView events" accent={COLORS.saffron} />
          <Kpi label="Unique Readers" value={totals.totalUniqueReaders.toLocaleString()} sub="distinct users" accent={COLORS.sage} />
          <Kpi label="Total Opens" value={totals.totalOpens.toLocaleString()} sub="OpenStory events" />
          <Kpi label="Duration" value={`${(totals.totalDuration/3600).toFixed(1)}h`} sub={fmtSecondsLong(totals.totalDuration)} />
          <Kpi label="Avg Rating" value={totals.avgRatingOverall.toFixed(2)} sub={`${totals.totalReviews} reviews`} accent={COLORS.gold} />
          <Kpi label="Subscribers" value={totals.activeSubscribers} sub={`of ${totals.totalUsers} users`} accent={COLORS.ink} />
          <Kpi label="Peak Hour" value={`${pad2(peakHourGlobal)}:00`} sub={`${totals.aggregateHourly[peakHourGlobal]} reads`} />
        </div>

        {/* Tab nav */}
        <div style={{ maxWidth: 1320, margin: "0 auto", borderTop: `1px solid ${COLORS.rule}`, padding: "0 32px", display: "flex", gap: 4, overflowX: "auto" }} className="scrollY">
          {TABS.map(t => (
            <button key={t.key} onClick={() => setTab(t.key)} className="tab-btn"
              style={{ background: "transparent", border: "none", cursor: "pointer", padding: "14px 18px",
                fontFamily: FONT_LATIN, fontSize: 14, fontWeight: tab === t.key ? 600 : 400,
                color: tab === t.key ? COLORS.saffron : COLORS.inkSoft,
                borderBottom: `2px solid ${tab === t.key ? COLORS.saffron : "transparent"}`,
                marginBottom: -1, whiteSpace: "nowrap", letterSpacing: "0.01em" }}>
              {t.label}
            </button>
          ))}
        </div>
      </header>

      <div className="fade-up" key={tab}>
        {tab === "stories" && <StoriesTab data={data} />}
        {tab === "bedtime" && <BedtimeTab data={data} />}
        {tab === "tags" && <TagsTab data={data} />}
        {tab === "readers" && <ReadersTab data={data} />}
        {tab === "revenue" && <RevenueTab data={data} />}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));


  // Hide loading screen
  setTimeout(() => {
    const l = document.getElementById('loading');
    if (l) { l.classList.add('hidden'); setTimeout(() => l.remove(), 300); }
  }, 50);
  </script>
