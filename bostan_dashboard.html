function fmtSeconds(sec) {
  if (!sec) return "0s";
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}
function fmtSecondsLong(sec) {
  if (!sec) return "0 seconds";
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m ${sec % 60}s`;
}
function fmtDate(s) {
  if (!s) return "—";
  try { return new Date(s).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }); }
  catch (e) { return s; }
}
function pct(n, total) {
  if (!total) return "0%";
  return `${(100 * n / total).toFixed(1)}%`;
}
function pad2(n) { return n < 10 ? `0${n}` : `${n}`; }
function pluralize(n, s, p) { return n === 1 ? s : (p || s + "s"); }

function StarRow({ value, size = 14, color = COLORS.gold, mute = COLORS.ruleSoft }) {
  const stars = [];
  for (let i = 1; i <= 5; i++) {
    const fill = Math.max(0, Math.min(1, value - (i - 1)));
    stars.push(
      <span key={i} style={{ position: "relative", display: "inline-block", width: size, height: size, marginRight: 1 }}>
        <svg viewBox="0 0 24 24" width={size} height={size} style={{ position: "absolute", inset: 0, color: mute }}>
          <path fill="currentColor" d="M12 2l2.9 6.9L22 10l-5.5 4.8L18 22l-6-3.6L6 22l1.5-7.2L2 10l7.1-1.1z"/>
        </svg>
        <span style={{ position: "absolute", inset: 0, overflow: "hidden", width: `${fill * 100}%` }}>
          <svg viewBox="0 0 24 24" width={size} height={size} style={{ color }}>
            <path fill="currentColor" d="M12 2l2.9 6.9L22 10l-5.5 4.8L18 22l-6-3.6L6 22l1.5-7.2L2 10l7.1-1.1z"/>
          </svg>
        </span>
      </span>
    );
  }
  return <span style={{ display: "inline-flex", alignItems: "center" }}>{stars}</span>;
}

function fmtRelative(ts, anchorTs) {
  if (!ts) return "—";
  const ms = (anchorTs || Date.now()) - ts;
  const sec = Math.floor(ms / 1000);
  const min = Math.floor(sec / 60);
  const hr = Math.floor(min / 60);
  const day = Math.floor(hr / 24);
  if (day >= 365) return `${Math.floor(day/365)}y ago`;
  if (day >= 30) return `${Math.floor(day/30)}mo ago`;
  if (day >= 7) return `${Math.floor(day/7)}w ago`;
  if (day >= 1) return `${day}d ago`;
  if (hr >= 1) return `${hr}h ago`;
  if (min >= 1) return `${min}m ago`;
  return "just now";
}
function fmtAbsolute(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${M[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function HourChart({ hourly, color = COLORS.saffron, height = 220 }) {
  const data = hourly.map((v, h) => ({ hour: h, label: pad2(h), value: v }));
  const peak = Math.max(...hourly);
  const peakHour = hourly.indexOf(peak);
  return (
    <div style={{ width: "100%", height, fontFamily: FONT_UI }}>
      <ResponsiveContainer>
        <BarChart data={data} margin={{ top: 16, right: 8, bottom: 8, left: -16 }}>
          <XAxis dataKey="label" tick={{ fill: COLORS.inkMute, fontSize: 10, fontFamily: FONT_MONO }} axisLine={{ stroke: COLORS.rule }} tickLine={false} interval={1} />
          <YAxis tick={{ fill: COLORS.inkMute, fontSize: 10, fontFamily: FONT_MONO }} axisLine={false} tickLine={false} width={36} allowDecimals={false} />
          <Tooltip cursor={{ fill: COLORS.surfaceAlt }} contentStyle={tooltipStyle}
            labelFormatter={(l) => `${l}:00 – ${l}:59`} formatter={(v) => [`${v} reads`, ""]} separator="" />
          <Bar dataKey="value" radius={[2, 2, 0, 0]}>
            {data.map((d) => (
              <Cell key={d.hour} fill={d.hour === peakHour && peak > 0 ? COLORS.saffron : color} fillOpacity={d.hour === peakHour && peak > 0 ? 1 : 0.78} />
            ))}
          </Bar>
        </BarChart>
      </ResponsiveContainer>
    </div>

}

function RatingHistogram({ hist, height = 100 }) {
  const total = hist.reduce((a,b) => a+b, 0);
  if (!total) return <div style={{ color: COLORS.inkMute, fontStyle: "italic", fontSize: 12 }}>No reviews yet.</div>;
  const data = hist.map((v, i) => ({ stars: `${i+1}★`, count: v, pct: 100*v/total }));
  return (
    <div style={{ width: "100%", height, fontFamily: FONT_UI }}>
      <ResponsiveContainer>
        <BarChart data={data} layout="vertical" margin={{ top: 4, right: 28, bottom: 0, left: 0 }}>
          <XAxis type="number" hide />
          <YAxis dataKey="stars" type="category" tick={{ fill: COLORS.inkSoft, fontSize: 11, fontFamily: FONT_MONO }} axisLine={false} tickLine={false} width={32} reversed />
          <Tooltip contentStyle={tooltipStyle} formatter={(v, _, p) => [`${v} (${p.payload.pct.toFixed(0)}%)`, "reviews"]} />
          <Bar dataKey="count" fill={COLORS.gold} radius={[0,2,2,0]}>
            {data.map((d, i) => <Cell key={i} fill={i >= 3 ? COLORS.gold : i >= 2 ? COLORS.saffronSoft : COLORS.burgundy} />)}
          </Bar>
        </BarChart>
      </ResponsiveContainer>
    </div>
  );
}

  { key: "totalDuration", label: "Duration" },
  { key: "avgRating",     label: "Rating" },
  { key: "bedtimeShare",  label: "Bedtime %" },
];

const TYPE_COLORS = {
  animal:     "#3F6B3A",  // sage
  fairy_tale: "#7A2E1F",  // burgundy
  royal:      "#B58A2E",  // gold
  adventure:  "#2F5772",  // blue
  moral:      "#5A4A38",  // ink soft
};

function typePillStyle(type, active = false) {
  const c = TYPE_COLORS[type] || "#8C7A62";
  return active
    ? { background: c, color: "#FBF7EE", border: `1px solid ${c}` }
    : { background: "transparent", color: c, border: `1px solid ${c}` };
}

function bedtimeBadgeStyle(cls) {
  switch (cls) {
    case "strong":  return { color: "#7A2E1F", border: "#7A2E1F", icon: "◐", label: "Strong Bedtime" };
    case "leaning": return { color: "#2F5772", border: "#2F5772", icon: "◐", label: "Bedtime-leaning" };
    case "mixed":   return { color: "#8C7A62", border: "#8C7A62", icon: "○", label: "Mixed" };
    case "daytime": return { color: "#B58A2E", border: "#B58A2E", icon: "☀", label: "Daytime" };
    default:        return { color: "#8C7A62", border: "#8C7A62", icon: "·", label: "Insufficient data" };
  }
}

function FilterPill({ active, onClick, children, color, accent }) {
  const c = color || "#2A1F17";
  return (
    <button onClick={onClick} className="filter-pill"
      style={{
        background: active ? c : "transparent",
        color: active ? "#FBF7EE" : c,
        border: `1px solid ${c}`,
        borderRadius: 999,
        padding: "5px 12px",
        fontSize: 11,
        fontFamily: "'IBM Plex Sans', sans-serif",
        fontWeight: active ? 600 : 400,
        letterSpacing: "0.04em",
        cursor: "pointer",
        transition: "all 120ms ease",
        whiteSpace: "nowrap",
      }}>
      {children}
    </button>
  );
}

/* =========================================================================== */
/*   TAB 1: STORIES                                                            */
/* =========================================================================== */
function CategoryComparisonChart({ data, ageFilter, typeFilter, sortKey, onCellClick, filterActive, filteredStories, onStorySelect }) {
  const TYPE_ORDER = ["fairy_tale", "animal", "royal", "moral", "adventure"];
  const AGE_ORDER = ["3-6", "7-9", "10+"];
  const AGE_FILLS = { "3-6": "#B58A2E", "7-9": "#3F6B3A", "10+": "#2F5772" };

  // Map sortKey to a metric config: how to aggregate per cell, how to display, layout type
  const dataMaxReadTs = data.dataMaxReadAt ? new Date(data.dataMaxReadAt).getTime() : Date.now();
  const METRIC = useMemo(() => {
    switch (sortKey) {
      case "reads":
        return { key: "reads", label: "Reads", subtitle: "stacked by age", layout: "stacked",
          agg: (stories) => stories.reduce((a, s) => a + s.reads, 0),
          format: (v) => v.toLocaleString(),
          formatTooltip: (v, count) => `${v.toLocaleString()} reads`,
          domain: undefined };
      case "uniqueReaders":
        return { key: "uniqueReaders", label: "Readers", subtitle: "stacked by age (sum of unique)", layout: "stacked",
          agg: (stories) => stories.reduce((a, s) => a + s.uniqueReaders, 0),
          format: (v) => v.toLocaleString(),
          formatTooltip: (v) => `${v.toLocaleString()} readers`,
          domain: undefined };
      case "totalDuration":
        return { key: "totalDuration", label: "Duration", subtitle: "stacked by age (hours)", layout: "stacked",
          agg: (stories) => stories.reduce((a, s) => a + s.totalDuration, 0) / 3600,
          format: (v) => `${v.toFixed(1)}h`,
          formatTooltip: (v) => `${v.toFixed(1)}h duration`,
          domain: undefined };
      case "avgRating":
        return { key: "avgRating", label: "Avg Rating", subtitle: "per cell · grouped by age", layout: "grouped",
          agg: (stories) => {
            const n = stories.reduce((a, s) => a + s.ratingCount, 0);
            return n > 0 ? stories.reduce((a, s) => a + s.avgRating * s.ratingCount, 0) / n : 0;
          },
          format: (v) => v > 0 ? v.toFixed(2) : "—",
          formatTooltip: (v) => v > 0 ? `${v.toFixed(2)} ★` : "no reviews",
          domain: [0, 5] };
      case "bedtimeShare":
        return { key: "bedtimeShare", label: "Bedtime %", subtitle: "per cell · grouped by age", layout: "grouped",
          agg: (stories) => {
            const total = stories.reduce((a, s) => a + s.reads, 0);
            const bt = stories.reduce((a, s) => a + (s.bedtimeReads || 0), 0);
            return total > 0 ? (bt / total) * 100 : 0;
          },
          format: (v) => `${v.toFixed(0)}%`,
          formatTooltip: (v) => `${v.toFixed(0)}% bedtime share`,
          domain: [0, 100] };
      case "lastReadTs":
        return { key: "lastReadTs", label: "Last Read", subtitle: "days since most recent · grouped by age", layout: "grouped",
          agg: (stories) => {
            const ts = stories.map(s => s.lastReadTs || 0).filter(t => t > 0);
            if (ts.length === 0) return null;
            const mostRecent = Math.max(...ts);
            return Math.max(0, (dataMaxReadTs - mostRecent) / 86400000); // days ago
          },
          format: (v) => v == null ? "—" : v < 1 ? "today" : `${Math.round(v)}d`,
          formatTooltip: (v) => v == null ? "no reads" : v < 1 ? "read today" : `${Math.round(v)} days ago`,
          domain: undefined,
          inverted: true };
      default:
        return { key: "reads", label: "Reads", subtitle: "stacked by age", layout: "stacked",
          agg: (stories) => stories.reduce((a, s) => a + s.reads, 0),
          format: (v) => v.toLocaleString(),
          formatTooltip: (v) => `${v} reads`,
          domain: undefined };
    }
  }, [sortKey, dataMaxReadTs]);

  // Group classified stories into (age, type) cells
  const cellMap = useMemo(() => {
    const map = {};
    data.stories.filter(s => s.ageGroup && s.storyType).forEach(s => {
      const k = `${s.ageGroup}|${s.storyType}`;
      if (!map[k]) map[k] = [];
      map[k].push(s);
    });
    return map;
  }, [data.stories]);

  // Build chart rows
  const chartData = useMemo(() => {
    return TYPE_ORDER.map(t => {
      const row = {
        type: t,
        labelAr: data.categories.typeLabels[t]?.ar || t,
        labelShortAr: data.categories.typeLabels[t]?.short_ar || t,
        total: 0,
      };
      AGE_ORDER.forEach(a => {
        const cellStories = cellMap[`${a}|${t}`] || [];
        const value = cellStories.length > 0 ? METRIC.agg(cellStories) : null;
        row[a] = value == null ? 0 : value;
        row[`${a}_present`] = cellStories.length > 0;
        row[`${a}_count`] = cellStories.length;
        row[`${a}_raw`] = value;
        row.total += row[a];
      });
      return row;
    });
  }, [cellMap, METRIC, data.categories]);

  // Format helper for bar value labels — concise representations
  const formatBarLabel = (v) => {
    if (v == null || v === 0) return "";
    if (METRIC.key === "totalDuration") return `${v.toFixed(1)}h`;
    if (METRIC.key === "avgRating") return v.toFixed(2);
    if (METRIC.key === "bedtimeShare") return `${v.toFixed(0)}%`;
    if (METRIC.key === "lastReadTs") return `${Math.round(v)}d`;
    return v.toLocaleString();
  };
  const FONT_LABEL = { fontFamily: FONT_MONO, fontSize: 10, fill: COLORS.inkSoft, fontWeight: 500 };

  // Per-age summary (right side panel)
  const ageSummary = useMemo(() => AGE_ORDER.map(a => {
    const stories = data.stories.filter(s => s.ageGroup === a);
    const value = stories.length > 0 ? METRIC.agg(stories) : null;
    return {
      age: a,
      label: data.categories.ageLabels[a]?.label || a,
      nameAr: data.categories.ageLabels[a]?.name_ar || a,
      value: value == null ? 0 : value,
      raw: value,
      count: stories.length,
    };
  }), [data.stories, METRIC, data.categories]);
  const maxAgeValue = Math.max(...ageSummary.map(a => a.value), 0.0001);

  // Custom tooltip
  const CustomTooltip = ({ active, payload }) => {
    if (!active || !payload || !payload.length) return null;
    const row = payload[0].payload;
    return (
      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.rule}`, borderRadius: 2,
          padding: "10px 14px", fontFamily: FONT_UI, fontSize: 12, boxShadow: "0 2px 8px rgba(42,31,23,0.08)" }}>
        <div dir="rtl" lang="ar" style={{ fontFamily: FONT_ARABIC, fontSize: 14, fontWeight: 600, color: COLORS.ink, marginBottom: 8 }}>
          {row.labelAr}
        </div>
        {AGE_ORDER.map(a => row[`${a}_present`] && (
          <div key={a} style={{ display: "flex", justifyContent: "space-between", gap: 16, fontSize: 11, lineHeight: 1.7 }}>
            <span style={{ color: AGE_FILLS[a], fontWeight: 500 }}>● ages {a}</span>
            <span style={{ fontFamily: FONT_MONO, color: COLORS.ink }}>
              {METRIC.formatTooltip(row[`${a}_raw`], row[`${a}_count`])}
              <span style={{ color: COLORS.inkMute }}> · {row[`${a}_count`]} {row[`${a}_count`] === 1 ? "story" : "stories"}</span>
            </span>
          </div>
        ))}
      </div>
    );
  };

  const handleBarClick = (entry, ageKey) => {
    if (entry && entry[`${ageKey}_present`]) {
      onCellClick(ageKey, entry.type);
    }
  };

  const isStacked = METRIC.layout === "stacked";

  // ===== Stories drill-down view (when filter is active) =====
  if (filterActive && filteredStories) {
    const TOP_N = 15;
    const truncate = (s, n = 14) => (s.length > n ? s.slice(0, n) + "…" : s);

    // Compute per-story metric value
    const valueOf = (s) => {
      switch (sortKey) {
        case "uniqueReaders": return s.uniqueReaders || 0;
        case "totalDuration": return (s.totalDuration || 0) / 3600;
        case "avgRating": return s.avgRating || 0;
        case "bedtimeShare": return (s.bedtimeShare || 0) * 100;
        case "lastReadTs":
          if (!s.lastReadTs) return null;
          return Math.max(0, (dataMaxReadTs - s.lastReadTs) / 86400000);
        default: return s.reads || 0;
      }
    };

    const sortedStories = [...filteredStories].sort((a, b) => {
      const va = valueOf(a), vb = valueOf(b);
      if (sortKey === "lastReadTs") {
        // Smaller days-ago = fresher = should come first
        if (va == null) return 1;
        if (vb == null) return -1;
        return va - vb;
      }
      return (vb || 0) - (va || 0);
    });

    const topStories = sortedStories.slice(0, TOP_N);
    const wasTruncated = sortedStories.length > TOP_N;

    const storyChartData = topStories.map((s, i) => ({
      id: s.id,
      title: s.title,
      shortTitle: truncate(s.title),
      ageGroup: s.ageGroup,
      typeLabelShortAr: s.typeLabelShortAr,
      reads: s.reads,
      ratingCount: s.ratingCount,
      avgRating: s.avgRating,
      raw: valueOf(s),
      value: valueOf(s) ?? 0,
      idx: i + 1,
    }));

    // Custom Arabic tick (rotated)
    const StoryTick = (props) => {
      const { x, y, payload } = props;
      return (
        <g transform={`translate(${x},${y})`}>
          <text x={0} y={0} dy={6} textAnchor="end"
            transform="rotate(-40)"
            style={{ fontFamily: FONT_ARABIC, fontSize: 11, fill: COLORS.inkSoft }}>
            {payload.value}
          </text>
        </g>
      );
    };

    const StoryTooltip = ({ active, payload }) => {
      if (!active || !payload || !payload.length) return null;
      const d = payload[0].payload;
      return (
        <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.rule}`, borderRadius: 2,
            padding: "10px 14px", fontFamily: FONT_UI, fontSize: 12, boxShadow: "0 2px 8px rgba(42,31,23,0.08)",
            minWidth: 220 }}>
          <div dir="rtl" lang="ar" style={{ fontFamily: FONT_ARABIC, fontSize: 15, fontWeight: 600, color: COLORS.ink, marginBottom: 6, lineHeight: 1.3 }}>
            {d.title}
          </div>
          <div style={{ fontSize: 10, fontFamily: FONT_MONO, color: COLORS.inkMute, letterSpacing: "0.06em", marginBottom: 6, textTransform: "uppercase" }}>
            ages {d.ageGroup} · <span dir="rtl" lang="ar" style={{ fontFamily: FONT_ARABIC, textTransform: "none" }}>{d.typeLabelShortAr}</span>
          </div>
          <div style={{ fontFamily: FONT_MONO, fontSize: 13, color: AGE_FILLS[d.ageGroup] || COLORS.ink, fontWeight: 500 }}>
            {METRIC.formatTooltip(d.raw, 1)}
          </div>
          <div style={{ marginTop: 6, fontSize: 10, fontFamily: FONT_UI, color: COLORS.inkMute, fontStyle: "italic" }}>
            Click bar to inspect →
          </div>
        </div>
      );
    };

    if (storyChartData.length === 0) {
      return (
        <div style={{ marginTop: 10, background: COLORS.surface, border: `1px solid ${COLORS.rule}`, borderRadius: 2,
            padding: "40px 20px", textAlign: "center", color: COLORS.inkMute, fontFamily: FONT_LATIN, fontStyle: "italic" }}>
          No stories match these filters.
        </div>
      );
    }

    return (
      <div style={{ marginTop: 10, background: COLORS.surface, border: `1px solid ${COLORS.rule}`, borderRadius: 2, padding: "20px 16px 12px" }}>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 12, paddingLeft: 6, paddingRight: 6, gap: 12, flexWrap: "wrap" }}>
          <div style={{ fontSize: 10, fontFamily: FONT_UI, letterSpacing: "0.16em", textTransform: "uppercase", color: COLORS.inkMute }}>
            {METRIC.label} by story · <span style={{ fontStyle: "italic", textTransform: "none", letterSpacing: "0.04em" }}>colored by age</span>
          </div>
          <div style={{ fontSize: 9, fontFamily: FONT_MONO, color: COLORS.inkMute, letterSpacing: "0.1em", textTransform: "uppercase" }}>
            {wasTruncated
              ? `Showing top ${TOP_N} of ${sortedStories.length} · synced with sort`
              : `${sortedStories.length} ${sortedStories.length === 1 ? "story" : "stories"} · synced with sort`}
          </div>
        </div>
        <div style={{ width: "100%", height: 360 }}>
          <ResponsiveContainer>
            <BarChart data={storyChartData} margin={{ top: 12, right: 16, bottom: 88, left: -8 }} barCategoryGap="22%">
              <XAxis dataKey="shortTitle" tick={<StoryTick />} interval={0} height={88} axisLine={{ stroke: COLORS.rule }} tickLine={false} />
              <YAxis tick={{ fill: COLORS.inkMute, fontSize: 10, fontFamily: FONT_MONO }}
                axisLine={false} tickLine={false} width={44}
                domain={METRIC.domain}
                tickFormatter={(v) => METRIC.key === "totalDuration" ? `${v.toFixed(1)}h`
                  : METRIC.key === "bedtimeShare" ? `${v.toFixed(0)}%`
                  : METRIC.key === "avgRating" ? v.toFixed(1)
                  : METRIC.key === "lastReadTs" ? `${Math.round(v)}d`
                  : v.toLocaleString()} />
              <Tooltip content={<StoryTooltip />} cursor={{ fill: "rgba(42,31,23,0.04)" }} />
              <Bar dataKey="value" radius={[3, 3, 0, 0]} style={{ cursor: "pointer" }}
                onClick={(entry) => entry && entry.id && onStorySelect(entry.id)}>
                {storyChartData.map((d, i) => (
                  <Cell key={i} fill={AGE_FILLS[d.ageGroup] || COLORS.ink} fillOpacity={0.88} />
                ))}
                <LabelList dataKey="value" position="top"
                  style={{ fontFamily: FONT_MONO, fontSize: 10, fill: COLORS.ink, fontWeight: 500 }}
                  formatter={(v) => {
                    if (v == null || v === 0) return "";
                    if (sortKey === "totalDuration") return `${v.toFixed(1)}h`;
                    if (sortKey === "avgRating") return v.toFixed(2);
                    if (sortKey === "bedtimeShare") return `${v.toFixed(0)}%`;
                    if (sortKey === "lastReadTs") return `${Math.round(v)}d`;
                    return v.toLocaleString();
                  }} />
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12, marginTop: 4, paddingLeft: 6, paddingRight: 6 }}>
          <div style={{ display: "flex", gap: 16, fontSize: 11, fontFamily: FONT_UI, color: COLORS.inkSoft }}>
            {AGE_ORDER.map(a => (
              <span key={a} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ width: 10, height: 10, background: AGE_FILLS[a], borderRadius: 2, display: "inline-block" }} />
                ages {a}
              </span>
            ))}
          </div>
          <div style={{ fontSize: 10, fontFamily: FONT_UI, color: COLORS.inkMute, fontStyle: "italic" }}>
            Click any bar to select that story in the library below.
          </div>
        </div>
      </div>
    );
  }

  // ===== Categories view (default) =====
  return (
    <div style={{ marginTop: 10 }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 280px", gap: 20, alignItems: "stretch" }}>
        <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.rule}`, borderRadius: 2, padding: "20px 16px 12px" }}>
          <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 8, paddingLeft: 6, paddingRight: 6 }}>
            <div style={{ fontSize: 10, fontFamily: FONT_UI, letterSpacing: "0.16em", textTransform: "uppercase", color: COLORS.inkMute }}>
              {METRIC.label} by type · <span style={{ fontStyle: "italic", textTransform: "none", letterSpacing: "0.04em" }}>{METRIC.subtitle}</span>
            </div>
            <div style={{ fontSize: 9, fontFamily: FONT_MONO, color: COLORS.inkMute, letterSpacing: "0.1em", textTransform: "uppercase" }}>
              Synced with sort
            </div>
          </div>
          <div style={{ width: "100%", height: 280 }}>
            <ResponsiveContainer>
              <BarChart data={chartData} margin={{ top: 12, right: 16, bottom: 8, left: -8 }} barCategoryGap={isStacked ? "20%" : "16%"}>
                <XAxis dataKey="labelShortAr" tick={{ fill: COLORS.inkSoft, fontSize: 13, fontFamily: FONT_ARABIC }}
                  axisLine={{ stroke: COLORS.rule }} tickLine={false} interval={0} />
                <YAxis tick={{ fill: COLORS.inkMute, fontSize: 10, fontFamily: FONT_MONO }}
                  axisLine={false} tickLine={false} width={44}
                  domain={METRIC.domain}
                  tickFormatter={(v) => METRIC.key === "totalDuration" ? `${v.toFixed(0)}h`
                    : METRIC.key === "bedtimeShare" ? `${v.toFixed(0)}%`
                    : METRIC.key === "avgRating" ? v.toFixed(1)
                    : METRIC.key === "lastReadTs" ? `${Math.round(v)}d`
                    : v.toLocaleString()} />
                <Tooltip content={<CustomTooltip />} cursor={{ fill: "rgba(42,31,23,0.04)" }} />
                {AGE_ORDER.map((a, idx) => (
                  <Bar key={a} dataKey={a} {...(isStacked ? { stackId: "metric" } : {})} fill={AGE_FILLS[a]}
                    radius={isStacked ? (idx === AGE_ORDER.length - 1 ? [3, 3, 0, 0] : 0) : [3, 3, 0, 0]}
                    style={{ cursor: "pointer" }}
                    onClick={(entry) => handleBarClick(entry, a)}>
                    {chartData.map((d, i) => {
                      const isFiltered = ageFilter === a && typeFilter === d.type;
                      const isDimmed = (ageFilter !== "all" || typeFilter !== "all") && !isFiltered;
                      const isPresent = d[`${a}_present`];
                      return <Cell key={i} fillOpacity={!isPresent ? 0 : isFiltered ? 1 : isDimmed ? 0.3 : 0.88} />;
                    })}
                    {/* Stacked: total label only on topmost bar; Grouped: per-bar value */}
                    {isStacked && idx === AGE_ORDER.length - 1 && (
                      <LabelList dataKey="total" position="top"
                        style={{ ...FONT_LABEL, fill: COLORS.ink, fontSize: 11 }}
                        formatter={(v) => formatBarLabel(v)} />
                    )}
                    {!isStacked && (
                      <LabelList dataKey={a} position="top"
                        style={{ ...FONT_LABEL, fill: AGE_FILLS[a] }}
                        formatter={(v) => formatBarLabel(v)} />
                    )}
                  </Bar>
                ))}
              </BarChart>
            </ResponsiveContainer>
          </div>
          <div style={{ display: "flex", justifyContent: "center", gap: 18, marginTop: 4, fontSize: 11, fontFamily: FONT_UI, color: COLORS.inkSoft }}>
            {AGE_ORDER.map(a => (
              <span key={a} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ width: 10, height: 10, background: AGE_FILLS[a], borderRadius: 2, display: "inline-block" }} />
                ages {a}
                <span dir="rtl" lang="ar" style={{ fontFamily: FONT_ARABIC, fontSize: 12, color: COLORS.inkMute, marginLeft: 2 }}>
                  ({data.categories.ageLabels[a]?.name_ar})
                </span>
              </span>
            ))}
          </div>
        </div>

        {/* Right side: per-age summary */}
        <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.rule}`, borderRadius: 2, padding: "20px 18px 16px" }}>
          <div style={{ fontSize: 10, fontFamily: FONT_UI, letterSpacing: "0.16em", textTransform: "uppercase", color: COLORS.inkMute, marginBottom: 14 }}>
            {METRIC.label} by age
          </div>
          {ageSummary.map(a => (
            <button key={a.age} onClick={() => onCellClick(a.age, "all")}
              style={{ display: "block", width: "100%", textAlign: "left", background: "transparent",
                border: "none", padding: "8px 0", cursor: "pointer", borderBottom: `1px solid ${COLORS.ruleSoft}` }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
                <span style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
                  <span style={{ fontFamily: FONT_LATIN, fontSize: 16, fontWeight: 600, color: AGE_FILLS[a.age] }}>{a.label}</span>
                  <span dir="rtl" lang="ar" style={{ fontFamily: FONT_ARABIC, fontSize: 13, color: COLORS.inkSoft }}>{a.nameAr}</span>
                </span>
                <span style={{ fontFamily: FONT_MONO, fontSize: 12, color: COLORS.ink, fontVariantNumeric: "tabular-nums" }}>
                  {METRIC.format(a.raw)}
                </span>
              </div>
              <div style={{ height: 6, background: COLORS.bg, borderRadius: 3, overflow: "hidden", marginBottom: 4 }}>
                <div style={{ height: "100%", width: `${(a.value / maxAgeValue) * 100}%`,
                  background: AGE_FILLS[a.age], opacity: ageFilter === a.age ? 1 : 0.7 }} />
              </div>
              <div style={{ fontSize: 10, fontFamily: FONT_MONO, color: COLORS.inkMute, letterSpacing: "0.04em" }}>
                {a.count} {a.count === 1 ? "story" : "stories"}
              </div>
            </button>
          ))}
          <div style={{ marginTop: 10, fontSize: 10, fontFamily: FONT_UI, color: COLORS.inkMute, fontStyle: "italic", lineHeight: 1.5 }}>
            Click a bar segment or row to filter. Change the sort dropdown to switch the metric.
          </div>
        </div>
      </div>
    </div>
  );
}


function StoriesTab({ data }) {
  const totals = data.totals;
  const peakHourGlobal = totals.aggregateHourly.indexOf(Math.max(...totals.aggregateHourly));

  const [ageFilter, setAgeFilter] = useState("all");
  const [typeFilter, setTypeFilter] = useState("all");
  const [bedtimeOnly, setBedtimeOnly] = useState(false);
  const [sortKey, setSortKey] = useState("reads");
  const dataMaxReadTs = useMemo(() => data.dataMaxReadAt
    ? new Date(data.dataMaxReadAt).getTime()
    : Date.now(), [data.dataMaxReadAt]);

  const filteredStories = useMemo(() => {
    let s = [...data.stories];
    if (ageFilter !== "all") s = s.filter(x => x.ageGroup === ageFilter);
    if (typeFilter !== "all") s = s.filter(x => x.storyType === typeFilter);
    if (bedtimeOnly) s = s.filter(x => x.isBedtimeStory);
    return s.sort((a, b) => (b[sortKey] || 0) - (a[sortKey] || 0));
  }, [data.stories, ageFilter, typeFilter, bedtimeOnly, sortKey]);

  const filterActive = ageFilter !== "all" || typeFilter !== "all" || bedtimeOnly;

  // Filter aggregate stats
  const filterStats = useMemo(() => {
    const totalReads = filteredStories.reduce((a, x) => a + x.reads, 0);
    const totalRatings = filteredStories.reduce((a, x) => a + x.ratingCount, 0);
    const totalBedtimeReads = filteredStories.reduce((a, x) => a + (x.bedtimeReads || 0), 0);
    const hourly = Array(24).fill(0);
    filteredStories.forEach(s => s.hourly.forEach((v, h) => { hourly[h] += v; }));
    const peakHour = hourly.indexOf(Math.max(...hourly));
    return {
      count: filteredStories.length,
      totalReads,
      totalOpens: filteredStories.reduce((a, x) => a + x.opens, 0),
      totalUniqueReaders: filteredStories.reduce((a, x) => a + x.uniqueReaders, 0), // sum, not dedup
      bedtimeStoryCount: filteredStories.filter(x => x.isBedtimeStory).length,
      bedtimeShare: totalReads > 0 ? totalBedtimeReads / totalReads : 0,
      avgRating: totalRatings > 0
        ? filteredStories.reduce((a, x) => a + (x.avgRating * x.ratingCount), 0) / totalRatings
        : 0,
      totalRatings,
      totalDuration: filteredStories.reduce((a, x) => a + x.totalDuration, 0),
      avgReadsPerStory: filteredStories.length > 0 ? totalReads / filteredStories.length : 0,
      hourly,
      peakHour,
      peakHourValue: hourly[peakHour],
    };
  }, [filteredStories]);

  // Selection-level insight bullets — describe the filtered subset
  const selectionInsights = useMemo(() => {
    if (!filteredStories.length) return [];
    const out = [];
    const totalReads = filteredStories.reduce((a, s) => a + s.reads, 0);
    const allPub = data.stories.filter(s => s.publishedDate);
    const catalogAvgReads = allPub.length > 0 ? allPub.reduce((a, s) => a + s.reads, 0) / allPub.length : 0;

    // 1. Top performer (most distinctive insight when there's a clear leader)
    if (filteredStories.length > 1 && totalReads > 0) {
      const top = filteredStories.reduce((a, b) => (a.reads > b.reads ? a : b));
      const share = top.reads / totalReads;
      if (share >= 0.4) {
        out.push({ tone: "info", icon: "◆",
          text: `${top.title} alone drives ${(share * 100).toFixed(0)}% of this selection's reads (${top.reads} of ${totalReads}).` });
      } else if (top.reads > 0) {
        out.push({ tone: "positive", icon: "◆",
          text: `Top performer: ${top.title} with ${top.reads} reads.` });
      }
    }

    // 2. Performance vs catalog average
    if (filteredStories.length > 0 && filteredStories.length < data.stories.length && catalogAvgReads > 0) {
      const myAvg = totalReads / filteredStories.length;
      const diff = ((myAvg - catalogAvgReads) / catalogAvgReads) * 100;
      if (Math.abs(diff) >= 20) {
        const verb = diff > 0 ? "outperforms" : "underperforms";
        out.push({ tone: diff > 0 ? "positive" : "negative", icon: diff > 0 ? "↗" : "↘",
          text: `This cohort ${verb} the catalog by ${Math.abs(diff).toFixed(0)}% — ${myAvg.toFixed(0)} reads/story vs ${catalogAvgReads.toFixed(0)} catalog avg.` });
      }
    }

    // 3. Discovery gaps within selection
    const gaps = filteredStories.filter(s => s.ratingCount >= 3 && s.avgRating >= 4.3 && s.reads < 40);
    if (gaps.length >= 2) {
      out.push({ tone: "info", icon: "★",
        text: `${gaps.length} of ${filteredStories.length} have 4.3★+ rating but under 40 reads — discovery gap worth surfacing.` });
    }

    // 4. Bedtime composition
    const bedtimeCount = filteredStories.filter(s => s.isBedtimeStory).length;
    if (filteredStories.length >= 4) {
      const pct = (bedtimeCount / filteredStories.length) * 100;
      if (pct >= 60) {
        out.push({ tone: "info", icon: "◐",
          text: `${bedtimeCount} of ${filteredStories.length} (${pct.toFixed(0)}%) are bedtime-leaning — strongly evening-skewed cohort.` });
      } else if (bedtimeCount === 0 && filteredStories.length >= 5) {
        out.push({ tone: "info", icon: "☀",
          text: `Zero bedtime fits in this selection — entirely a daytime cohort.` });
      }
    }

    // 5. Cold cohort
    if (filteredStories.length >= 5 && data.dataMaxReadAt) {
      const maxTs = new Date(data.dataMaxReadAt).getTime();
      const stale = filteredStories.filter(s => s.lastReadTs && (maxTs - s.lastReadTs) / 86400000 > 45);
      if (stale.length >= filteredStories.length * 0.6) {
        out.push({ tone: "negative", icon: "○",
          text: `${stale.length} of ${filteredStories.length} haven't been read in 45+ days — cohort is cooling.` });
      }
    }

    // 6. Concentration / long tail
    if (filteredStories.length >= 6) {
      const sorted = [...filteredStories].sort((a, b) => b.reads - a.reads);
      const topN = Math.max(1, Math.floor(filteredStories.length * 0.2));
      const topShare = sorted.slice(0, topN).reduce((a, s) => a + s.reads, 0) / Math.max(totalReads, 1);
      if (topShare >= 0.65) {
        out.push({ tone: "neutral", icon: "⚖",
          text: `Top ${topN} title${topN === 1 ? "" : "s"} concentrate ${(topShare * 100).toFixed(0)}% of reads — long-tail distribution.` });
      }
    }

    return out.slice(0, 3);
  }, [filteredStories, data.stories, data.dataMaxReadAt]);

  const [selectedId, setSelectedId] = useState(data.stories[0]?.id);
  const visibleIds = useMemo(() => new Set(filteredStories.map(s => s.id)), [filteredStories]);
  const effectiveSelectedId = visibleIds.has(selectedId) ? selectedId : (filteredStories[0]?.id);
  const selected = useMemo(
    () => data.stories.find((s) => s.id === effectiveSelectedId) || data.stories[0],
    [data.stories, effectiveSelectedId]
  );

  const peakHourSelected = selected.hourly.indexOf(Math.max(...selected.hourly));
  const avgSession = selected.sessions > 0 ? Math.round(selected.totalDuration / selected.sessions) : 0;
  const readsPerReader = selected.uniqueReaders > 0 ? (selected.reads / selected.uniqueReaders) : 0;
  const selectedBadge = bedtimeBadgeStyle(selected.bedtimeClass);

  const clearFilters = () => { setAgeFilter("all"); setTypeFilter("all"); setBedtimeOnly(false); };

  return (
    <>
      {/* Aggregate hourly chart (filter-aware) */}
      <section style={{ maxWidth: 1320, margin: "0 auto", padding: "32px 32px 8px" }}>
        <SectionHead title="When stories are read" italic={filterActive ? "filtered selection · across the day" : "across the day"}
          right={<div style={{ fontSize: 11, fontFamily: FONT_MONO, color: COLORS.inkMute, letterSpacing: "0.08em" }}>
            {filterActive ? `${filterStats.count} STORIES` : "ALL STORIES"} · 24H · UTC
          </div>} />
        <Ornament />
        <div style={{ marginTop: 10, padding: "14px 8px", background: COLORS.surface, border: `1px solid ${COLORS.rule}`, borderRadius: 2 }}>
          <HourChart hourly={filterStats.hourly} height={180} color={filterActive ? COLORS.saffron : COLORS.sage} />
        </div>
      </section>

      {/* Clean filter bar */}
      <section style={{ maxWidth: 1320, margin: "0 auto", padding: "24px 32px 0" }}>
        <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.rule}`, borderRadius: 2, padding: "18px 22px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
            <span style={{ fontSize: 10, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: COLORS.inkMute, minWidth: 36 }}>Age</span>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {AGES.map(a => (
                <FilterPill key={a.key} active={ageFilter === a.key} onClick={() => setAgeFilter(a.key)} color={COLORS.ink}>
                  {a.label}
                </FilterPill>
              ))}
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
            <span style={{ fontSize: 10, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: COLORS.inkMute, minWidth: 36 }}>Type</span>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {TYPES.map(t => (
                <FilterPill key={t.key} active={typeFilter === t.key} onClick={() => setTypeFilter(t.key)}
                  color={t.key === "all" ? COLORS.ink : TYPE_COLORS[t.key]}>
                  <span dir="rtl" lang="ar" style={{ fontFamily: FONT_ARABIC, fontSize: 13 }}>{t.label}</span>
                </FilterPill>
              ))}
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap", paddingTop: 4, borderTop: `1px solid ${COLORS.ruleSoft}`, paddingBottom: 0, marginTop: 4 }}>
            <FilterPill active={bedtimeOnly} onClick={() => setBedtimeOnly(!bedtimeOnly)} color={COLORS.burgundy}>
              {bedtimeOnly ? "✓ " : ""}Bedtime only
            </FilterPill>
            <div style={{ flex: 1 }} />
            <span style={{ fontSize: 10, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: COLORS.inkMute }}>Sort</span>
            <select value={sortKey} onChange={(e) => setSortKey(e.target.value)}
              style={{ padding: "5px 10px", fontSize: 12, fontFamily: FONT_UI,
                background: COLORS.bg, border: `1px solid ${COLORS.rule}`, borderRadius: 2,
                color: COLORS.ink, cursor: "pointer" }}>
              {SORTS.map(s => <option key={s.key} value={s.key}>{s.label}</option>)}
            </select>
            {filterActive && (
              <button onClick={clearFilters}
                style={{ background: "transparent", border: "none", cursor: "pointer",
                  fontFamily: FONT_UI, fontSize: 11, color: COLORS.saffron, letterSpacing: "0.08em",
                  textTransform: "uppercase", textDecoration: "underline" }}>
                Clear filters
              </button>
            )}
          </div>
        </div>

        {/* Selection summary — always visible · KPI tiles first, insights below */}
        <div style={{ marginTop: 12, background: COLORS.surfaceAlt, border: `1px solid ${COLORS.rule}`, borderRadius: 2, padding: "14px 22px" }}>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 28, alignItems: "baseline" }}>
              <div>
                <div style={{ fontSize: 9, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: COLORS.inkMute, marginBottom: 2 }}>Stories</div>
                <div style={{ fontFamily: FONT_LATIN, fontSize: 28, fontWeight: 500, color: COLORS.saffron, lineHeight: 1, letterSpacing: "-0.02em" }}>{filterStats.count}</div>
              </div>
              <div>
                <div style={{ fontSize: 9, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: COLORS.inkMute, marginBottom: 2 }}>Reads</div>
                <div style={{ fontFamily: FONT_LATIN, fontSize: 22, fontWeight: 500, color: COLORS.ink, lineHeight: 1.1, fontVariantNumeric: "tabular-nums" }}>
                  {filterStats.totalReads.toLocaleString()}
                  <span style={{ fontSize: 11, color: COLORS.inkMute, fontFamily: FONT_MONO, marginLeft: 6 }}>
                    {filterStats.count > 0 && `${filterStats.avgReadsPerStory.toFixed(0)}/story avg`}
                  </span>
                </div>
              </div>
              <div>
                <div style={{ fontSize: 9, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: COLORS.inkMute, marginBottom: 2 }}>Duration</div>
                <div style={{ fontFamily: FONT_LATIN, fontSize: 22, fontWeight: 500, color: COLORS.ink, lineHeight: 1.1, fontVariantNumeric: "tabular-nums" }}>
                  {(filterStats.totalDuration / 3600).toFixed(1)}h
                </div>
              </div>
              {filterStats.totalRatings > 0 && (
                <div>
                  <div style={{ fontSize: 9, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: COLORS.inkMute, marginBottom: 2 }}>Avg Rating</div>
                  <div style={{ fontFamily: FONT_LATIN, fontSize: 22, fontWeight: 500, color: COLORS.gold, lineHeight: 1.1, fontVariantNumeric: "tabular-nums" }}>
                    {filterStats.avgRating.toFixed(2)}
                    <span style={{ fontSize: 11, color: COLORS.inkMute, fontFamily: FONT_MONO, marginLeft: 6 }}>
                      {filterStats.totalRatings} reviews
                    </span>
                  </div>
                </div>
              )}
              <div>
                <div style={{ fontSize: 9, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: COLORS.inkMute, marginBottom: 2 }}>Bedtime share</div>
                <div style={{ fontFamily: FONT_LATIN, fontSize: 22, fontWeight: 500, color: COLORS.burgundy, lineHeight: 1.1, fontVariantNumeric: "tabular-nums" }}>
                  {(filterStats.bedtimeShare * 100).toFixed(0)}%
                  <span style={{ fontSize: 11, color: COLORS.inkMute, fontFamily: FONT_MONO, marginLeft: 6 }}>
                    {filterStats.bedtimeStoryCount} bedtime
                  </span>
                </div>
              </div>
              <div>
                <div style={{ fontSize: 9, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: COLORS.inkMute, marginBottom: 2 }}>Peak hour</div>
                <div style={{ fontFamily: FONT_LATIN, fontSize: 22, fontWeight: 500, color: COLORS.ink, lineHeight: 1.1, fontVariantNumeric: "tabular-nums" }}>
                  {pad2(filterStats.peakHour)}:00
                  <span style={{ fontSize: 11, color: COLORS.inkMute, fontFamily: FONT_MONO, marginLeft: 6 }}>
                    {filterStats.peakHourValue} reads · UTC
                  </span>
                </div>
              </div>
            </div>
            {selectionInsights.length > 0 && (
              <ul style={{ margin: "14px 0 0 0", padding: "12px 0 0 0", listStyle: "none",
                  borderTop: `1px dashed ${COLORS.ruleSoft}` }}>
                {selectionInsights.map((ins, i) => {
                  const toneColor = ins.tone === "positive" ? COLORS.sage
                    : ins.tone === "negative" ? COLORS.saffron
                    : ins.tone === "info" ? COLORS.blue
                    : COLORS.inkSoft;
                  return (
                    <li key={i} style={{ display: "grid", gridTemplateColumns: "22px 1fr", gap: 10,
                      padding: "4px 0", alignItems: "baseline" }}>
                      <span style={{ fontFamily: FONT_MONO, fontSize: 13, color: toneColor, fontWeight: 500, textAlign: "center" }}>{ins.icon}</span>
                      <span style={{ fontFamily: FONT_LATIN, fontSize: 13, color: COLORS.ink, lineHeight: 1.55 }}>{ins.text}</span>
                    </li>
                  );
                })}
              </ul>
            )}
          </div>
      </section>

      {/* Categories at a glance — comparison chart (drills into stories when filtered) */}
      <section style={{ maxWidth: 1320, margin: "0 auto", padding: "24px 32px 0" }}>
        <SectionHead
          title={filterActive ? "Stories compared" : "Categories compared"}
          italic={filterActive ? "individual stories in the filtered selection" : "reads by type, broken down by age"}
          right={<div style={{ fontSize: 10, fontFamily: FONT_MONO, color: COLORS.inkMute, letterSpacing: "0.08em" }}>
            {filterActive ? "CLICK A BAR TO INSPECT STORY" : "CLICK A SEGMENT TO FILTER"}
          </div>} />
        <CategoryComparisonChart data={data} ageFilter={ageFilter} typeFilter={typeFilter} sortKey={sortKey}
          filterActive={filterActive}
          filteredStories={filteredStories}
          onStorySelect={(id) => setSelectedId(id)}
          onCellClick={(age, type) => {
            if (ageFilter === age && typeFilter === type) {
              setAgeFilter("all"); setTypeFilter("all");
            } else {
              setAgeFilter(age); setTypeFilter(type);
            }
          }} />
      </section>

      {/* Two columns */}
      <main style={{ maxWidth: 1320, margin: "0 auto", padding: "24px 32px 60px", display: "grid", gridTemplateColumns: "minmax(360px, 460px) 1fr", gap: 24 }}>
        <aside style={{ background: COLORS.surface, border: `1px solid ${COLORS.rule}`, borderRadius: 2, display: "flex", flexDirection: "column", maxHeight: "calc(100vh - 60px)" }}>
          <div style={{ padding: "16px 18px", borderBottom: `1px solid ${COLORS.rule}`, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
            <h3 style={{ margin: 0, fontFamily: FONT_LATIN, fontSize: 16, fontWeight: 500, letterSpacing: "0.02em" }}>The Library</h3>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 10, fontFamily: FONT_MONO, color: COLORS.inkMute, letterSpacing: "0.1em" }}>
                {filteredStories.length} · BY
              </span>
              <select value={sortKey} onChange={(e) => setSortKey(e.target.value)}
                style={{ background: COLORS.bg, border: `1px solid ${COLORS.rule}`, borderRadius: 2,
                  padding: "4px 8px", fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.04em",
                  color: COLORS.ink, cursor: "pointer", textTransform: "uppercase" }}>
                {SORTS.map(s => <option key={s.key} value={s.key}>{s.label}</option>)}
              </select>
            </div>
          </div>
          <div className="scrollY" style={{ overflowY: "auto", flex: 1 }}>
            {filteredStories.length === 0 && (
              <div style={{ padding: "48px 20px", textAlign: "center", color: COLORS.inkMute, fontFamily: FONT_LATIN, fontStyle: "italic", fontSize: 13 }}>
                No stories match these filters.
              </div>
            )}
            {filteredStories.map((s, i) => {
              const active = s.id === selected.id;
              const typeColor = TYPE_COLORS[s.storyType];
              const sortValue = sortKey === "totalDuration" ? fmtSeconds(s[sortKey])
                : sortKey === "avgRating" ? (s.avgRating ? s.avgRating.toFixed(1) : "—")
                : sortKey === "bedtimeShare" ? `${(s.bedtimeShare * 100).toFixed(0)}%`
                : sortKey === "lastReadTs" ? fmtRelative(s.lastReadTs, dataMaxReadTs)
                : (s[sortKey] || 0).toLocaleString();
              return (
                <button key={s.id} onClick={() => setSelectedId(s.id)} className={`row-hover ${active ? "active" : ""}`}
                  style={{ width: "100%", textAlign: "left", background: "transparent", border: "none",
                    borderBottom: `1px solid ${COLORS.ruleSoft}`, padding: "14px 18px", cursor: "pointer",
                    display: "grid", gridTemplateColumns: "24px 56px 1fr auto", gap: 14, alignItems: "center",
                    borderLeft: active ? `3px solid ${COLORS.saffron}` : "3px solid transparent",
                  }}>
                  <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: COLORS.inkMute }}>{pad2(i + 1)}</span>
                  {s.poster ? (
                    <img src={s.poster} alt="" loading="lazy"
                      onError={(e) => { e.currentTarget.style.visibility = "hidden"; }}
                      style={{ width: 56, height: 76, objectFit: "cover", borderRadius: 3,
                        border: `1px solid ${COLORS.rule}`, background: COLORS.surfaceAlt,
                        boxShadow: active ? "0 2px 6px rgba(42,31,23,0.12)" : "0 1px 2px rgba(42,31,23,0.06)" }} />
                  ) : (
                    <div style={{ width: 56, height: 76, borderRadius: 3, border: `1px dashed ${COLORS.rule}`,
                      background: COLORS.surfaceAlt, display: "flex", alignItems: "center", justifyContent: "center",
                      fontFamily: FONT_MONO, fontSize: 9, color: COLORS.inkMute, letterSpacing: "0.1em" }}>—</div>
                  )}
                  <span style={{ minWidth: 0 }}>
                    <ArabicText size={18} weight={active ? 700 : 600}>{s.title}</ArabicText>
                    <div style={{ marginTop: 5, display: "flex", flexWrap: "wrap", gap: 4, alignItems: "center" }}>
                      {s.ageGroup && (
                        <span style={{ fontSize: 9, fontFamily: FONT_MONO, padding: "1px 6px", borderRadius: 999,
                          color: COLORS.inkSoft, background: COLORS.bg, border: `1px solid ${COLORS.ruleSoft}`,
                          letterSpacing: "0.05em" }}>{s.ageGroup}</span>
                      )}
                      {s.storyType && typeColor && (
                        <span style={{ fontSize: 9, fontFamily: FONT_MONO, padding: "1px 6px", borderRadius: 999,
                          color: typeColor, border: `1px solid ${typeColor}`,
                          letterSpacing: "0.04em", fontFamily: FONT_ARABIC, fontSize: 11 }}>{s.typeLabelShortAr}</span>
                      )}
                      {s.isBedtimeStory && (
                        <span style={{ fontSize: 9, fontFamily: FONT_MONO, padding: "1px 6px", borderRadius: 999,
                          color: COLORS.burgundy, border: `1px solid ${COLORS.burgundy}`,
                          letterSpacing: "0.05em", textTransform: "uppercase" }}>◐ Bedtime</span>
                      )}
                    </div>
                    <div style={{ marginTop: 5, fontFamily: FONT_MONO, fontSize: 10, color: COLORS.inkMute, letterSpacing: "0.06em" }}>
                      {s.reads} reads · {s.uniqueReaders} readers · {fmtSeconds(s.totalDuration)}
                      {s.ratingCount > 0 && (<> · ⭐{s.avgRating.toFixed(1)}</>)}
                    </div>
                  </span>
                  <span style={{ fontFamily: FONT_MONO, fontSize: 12, color: active ? COLORS.saffron : COLORS.inkSoft,
                      fontVariantNumeric: "tabular-nums", fontWeight: 500 }}>
                    {sortValue}
                  </span>
                </button>
              );
            })}
          </div>
        </aside>

        {/* Detail */}
        <section className="fade-up" key={selected.id} style={{ background: COLORS.surface, border: `1px solid ${COLORS.rule}`, borderRadius: 2, padding: "28px 32px" }}>
          {/* Header with badges */}
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 24, marginBottom: 16, flexWrap: "wrap" }}>
            <div style={{ flex: 1, minWidth: 280 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
                {selected.ageGroup && (
                  <span style={{ fontSize: 10, fontFamily: FONT_MONO, padding: "3px 10px", borderRadius: 999,
                      color: COLORS.inkSoft, background: COLORS.bg, border: `1px solid ${COLORS.rule}`,
                      letterSpacing: "0.08em", textTransform: "uppercase", fontWeight: 500 }}>
                    Ages {selected.ageGroup}
                  </span>
                )}
                {selected.typeLabelAr && (
                  <span dir="rtl" lang="ar" style={{ fontSize: 13, fontFamily: FONT_ARABIC, padding: "2px 12px", borderRadius: 999,
                      color: TYPE_COLORS[selected.storyType], border: `1px solid ${TYPE_COLORS[selected.storyType]}`,
                      fontWeight: 500 }}>
                    {selected.typeLabelAr}
                  </span>
                )}
                {selected.isBedtimeStory && (
                  <span style={{ fontSize: 10, fontFamily: FONT_MONO, padding: "3px 10px", borderRadius: 999,
                      color: selectedBadge.color, border: `1px solid ${selectedBadge.border}`,

                    {selectedBadge.icon} {selectedBadge.label} · {(selected.bedtimeShare * 100).toFixed(0)}%
                  </span>

                <span style={{ fontSize: 10, fontFamily: FONT_MONO, color: COLORS.inkMute, letterSpacing: "0.1em", textTransform: "uppercase", marginLeft: 4 }}>

                  {selected.is_paid ? " · paid" : ""}{selected.is_featured ? " · featured" : ""}
                </span>
              </div>
              <ArabicText size={42} weight={700}>{selected.title}</ArabicText>
              {selected.logline && (
                <p dir="rtl" lang="ar" style={{ marginTop: 12, fontFamily: FONT_ARABIC, fontSize: 17, color: COLORS.inkSoft, lineHeight: 1.7, maxWidth: 640 }}>
                  {selected.logline}
                </p>
              )}
            </div>
            {selected.poster && (
              <img src={selected.poster} alt="" onError={(e) => { e.currentTarget.style.display = "none"; }}
                style={{ width: 96, height: 132, objectFit: "cover", border: `1px solid ${COLORS.rule}`, borderRadius: 2, background: COLORS.surfaceAlt }} />
            )}
          </div>

          {/* Manner tags */}
          {(selected.positiveTags.length > 0 || selected.negativeTags.length > 0) && (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 24 }}>
              {selected.positiveTags.map((t) => (
                <span key={`p${t}`} dir="rtl" lang="ar" style={{ fontFamily: FONT_ARABIC, fontSize: 13, padding: "3px 10px", border: `1px solid ${COLORS.sage}`, color: COLORS.sage, borderRadius: 999 }}>{t}</span>
              ))}
              {selected.negativeTags.map((t) => (
                <span key={`n${t}`} dir="rtl" lang="ar" style={{ fontFamily: FONT_ARABIC, fontSize: 13, padding: "3px 10px", border: `1px solid ${COLORS.saffron}`, color: COLORS.saffron, borderRadius: 999 }}>{t}</span>
              ))}
            </div>
          )}

          {/* Big metrics */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 0, border: `1px solid ${COLORS.rule}`, borderRadius: 2, marginBottom: 24 }}>
            <DetailKpi label="Reads" value={selected.reads.toLocaleString()} sub="StoryView events" accent={COLORS.saffron} primary />
            <DetailKpi label="Unique Readers" value={selected.uniqueReaders.toLocaleString()} sub={selected.reads > 0 ? `${readsPerReader.toFixed(1)} reads / reader` : "—"} accent={COLORS.sage} />
            <DetailKpi label="Opens" value={selected.opens.toLocaleString()} sub={`${selected.uniqueOpeners} unique users`} />
            <DetailKpi label="Total Duration" value={fmtSeconds(selected.totalDuration)} sub={`${selected.totalDuration.toLocaleString()} sec · ${selected.sessions} sessions`} />
            <DetailKpi label="Avg Rating" value={selected.ratingCount ? selected.avgRating.toFixed(2) : "—"}
              sub={selected.ratingCount ? `${selected.ratingCount} reviewer${selected.ratingCount === 1 ? "" : "s"}` : "no reviews"}
              accent={COLORS.gold}
              extra={selected.ratingCount ? <div style={{ marginTop: 6 }}><StarRow value={selected.avgRating} /></div> : null} />
          </div>

          {/* Mini metrics */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 24, marginBottom: 24 }}>
            <MiniMetric label="Reads / Reader" value={selected.uniqueReaders > 0 ? readsPerReader.toFixed(2) : "—"}
              sub={selected.uniqueReaders > 0 ? `${selected.reads} ÷ ${selected.uniqueReaders}` : "no readers"} />
            <MiniMetric label="Avg Session" value={selected.sessions > 0 ? fmtSeconds(avgSession) : "—"}
              sub={selected.sessions > 0 ? `${selected.sessions} sessions` : "no duration"} />
            <MiniMetric label="Peak Hour" value={selected.reads > 0 ? `${pad2(peakHourSelected)}:00` : "—"}
              sub={selected.reads > 0 ? `${selected.hourly[peakHourSelected]} reads` : "no data"} />
            <MiniMetric label="Bedtime Share" value={selected.reads >= 5 ? `${(selected.bedtimeShare * 100).toFixed(0)}%` : "—"}
              sub={selected.reads >= 5 ? `${selected.bedtimeReads} of ${selected.reads}` : "low sample"} />
            <MiniMetric label="Published" value={fmtDate(selected.publishedDate)} sub={`${selected.sceneCount} scenes`} />
          </div>

          {/* Category context — NEW */}
          {selected.categoryRank && (
            <div style={{ marginBottom: 28, padding: "20px 24px", background: COLORS.bg, border: `1px solid ${COLORS.ruleSoft}`, borderRadius: 2 }}>
              <div style={{ fontSize: 10, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: COLORS.inkMute, marginBottom: 14 }}>
                Compared to peers
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 20 }}>
                <div>
                  <div style={{ fontFamily: FONT_LATIN, fontSize: 13, color: COLORS.inkSoft, lineHeight: 1.5 }}>
                    Rank in <strong style={{ color: TYPE_COLORS[selected.storyType] }}><span dir="rtl" lang="ar" style={{ fontFamily: FONT_ARABIC }}>{selected.typeLabelAr}</span></strong> ages <strong>{selected.ageGroup}</strong>
                  </div>
                  <div className="serifnum" style={{ fontFamily: FONT_LATIN, fontSize: 28, fontWeight: 500, color: COLORS.ink, marginTop: 4 }}>
                    #{selected.categoryRank} <span style={{ fontSize: 14, color: COLORS.inkMute, fontWeight: 400 }}>of {selected.categorySize}</span>
                  </div>
                </div>
                <div>
                  <div style={{ fontFamily: FONT_LATIN, fontSize: 13, color: COLORS.inkSoft, lineHeight: 1.5 }}>
                    Reads vs cell average
                  </div>
                  <div className="serifnum" style={{ fontFamily: FONT_LATIN, fontSize: 28, fontWeight: 500, color: selected.reads >= selected.categoryAvgReads ? COLORS.sage : COLORS.burgundy, marginTop: 4 }}>
                    {selected.reads >= selected.categoryAvgReads ? "+" : ""}{((selected.reads - selected.categoryAvgReads) / Math.max(selected.categoryAvgReads, 1) * 100).toFixed(0)}%
                    <span style={{ fontSize: 14, color: COLORS.inkMute, fontWeight: 400 }}> vs {Math.round(selected.categoryAvgReads)}</span>
                  </div>
                </div>
                <div>
                  <div style={{ fontFamily: FONT_LATIN, fontSize: 13, color: COLORS.inkSoft, lineHeight: 1.5 }}>
                    Rank across all <strong style={{ color: TYPE_COLORS[selected.storyType] }}><span dir="rtl" lang="ar" style={{ fontFamily: FONT_ARABIC }}>{selected.typeLabelAr}</span></strong> stories
                  </div>
                  <div className="serifnum" style={{ fontFamily: FONT_LATIN, fontSize: 28, fontWeight: 500, color: COLORS.ink, marginTop: 4 }}>
                    #{selected.typeRank} <span style={{ fontSize: 14, color: COLORS.inkMute, fontWeight: 400 }}>of {selected.typeSize}</span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Story Insights — data-driven bullets */}
          {selected.insights && selected.insights.length > 0 && (
            <div style={{ marginBottom: 24, padding: "20px 24px", background: COLORS.surface,
                border: `1px solid ${COLORS.rule}`, borderRadius: 2,
                boxShadow: "0 1px 0 rgba(42,31,23,0.02), inset 0 1px 0 rgba(251,247,238,0.6)" }}>
              <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 14, gap: 12, flexWrap: "wrap" }}>
                <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
                  <span style={{ fontFamily: FONT_LATIN, fontSize: 18, fontWeight: 500, color: COLORS.ink, letterSpacing: "-0.01em" }}>
                    Story Insights
                  </span>
                  <span style={{ fontSize: 10, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: COLORS.inkMute }}>
                    auto-generated · data-driven
                  </span>
                </div>
                <span style={{ fontSize: 10, fontFamily: FONT_MONO, color: COLORS.inkMute, letterSpacing: "0.08em" }}>
                  {selected.insights.length} {selected.insights.length === 1 ? "finding" : "findings"}
                </span>
              </div>
              <ul style={{ margin: 0, padding: 0, listStyle: "none" }}>
                {selected.insights.map((ins, i) => {
                  const toneColor = ins.tone === "positive" ? COLORS.sage
                    : ins.tone === "negative" ? COLORS.saffron
                    : ins.tone === "info" ? COLORS.blue
                    : COLORS.inkSoft;
                  return (
                    <li key={i} style={{
                      display: "grid", gridTemplateColumns: "26px 1fr", gap: 10,
                      padding: "10px 0", alignItems: "start",
                      borderTop: i === 0 ? "none" : `1px dashed ${COLORS.ruleSoft}`,
                    }}>
                      <span style={{
                        fontFamily: FONT_MONO, fontSize: 14, color: toneColor,
                        fontWeight: 500, lineHeight: 1.5, textAlign: "center",
                      }}>{ins.icon}</span>
                      <span style={{
                        fontFamily: FONT_LATIN, fontSize: 13.5, color: COLORS.ink,
                        lineHeight: 1.6,
                      }}>{ins.text}</span>
                    </li>
                  );
                })}
              </ul>
            </div>
          )}

          {/* Plot summary always visible */}
          {selected.plotSummary && (
            <div style={{ marginBottom: 24 }}>
              <div style={{ fontSize: 10, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: COLORS.inkMute, marginBottom: 8 }}>
                Plot summary
              </div>
              <p dir="rtl" lang="ar" style={{ margin: 0, fontFamily: FONT_ARABIC, fontSize: 15, color: COLORS.ink, lineHeight: 1.9, padding: "16px 20px", background: COLORS.bg, borderRadius: 2, border: `1px solid ${COLORS.ruleSoft}` }}>
                {selected.plotSummary}
              </p>
            </div>
          )}

          {/* Bedtime analysis (only for bedtime stories with curated commentary) */}
          {selected.whyBedtime && (
            <div style={{ marginBottom: 24, padding: "16px 20px", background: COLORS.bg, borderLeft: `3px solid ${selectedBadge.color}`, borderRadius: 2 }}>
              <div style={{ fontSize: 10, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: selectedBadge.color, marginBottom: 8 }}>
                Why it works at bedtime
              </div>
              <div style={{ fontSize: 13, fontFamily: FONT_LATIN, color: COLORS.ink, lineHeight: 1.7, marginBottom: selected.whyReads ? 14 : 0 }}>
                {selected.whyBedtime}
              </div>
              {selected.whyReads && (
                <>
                  <div style={{ fontSize: 10, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: COLORS.saffron, marginBottom: 8 }}>
                    Why this read count
                  </div>
                  <div style={{ fontSize: 13, fontFamily: FONT_LATIN, color: COLORS.ink, lineHeight: 1.7 }}>
                    {selected.whyReads}
                  </div>
                </>
              )}
            </div>
          )}

          {/* Rating histogram */}
          {selected.ratingCount > 0 && (
            <div style={{ marginBottom: 28 }}>
              <SectionHead title="Rating distribution" italic={`${selected.ratingCount} ${pluralize(selected.ratingCount, "review")}`} />
              <RatingHistogram hist={selected.ratingHist} />
            </div>
          )}

          {/* Hourly chart */}
          <div>
            <SectionHead title="Reading times" italic="hour-of-day distribution"
              right={<div style={{ fontSize: 10, fontFamily: FONT_MONO, color: COLORS.inkMute, letterSpacing: "0.1em" }}>READS · 24H · UTC</div>} />
            {selected.reads > 0
              ? <HourChart hourly={selected.hourly} color={COLORS.sage} height={240} />
              : <div style={{ padding: "40px 20px", textAlign: "center", color: COLORS.inkMute, fontFamily: FONT_LATIN, fontStyle: "italic" }}>No reads recorded for this story yet.</div>
            }
          </div>

          <div style={{ marginTop: 36, paddingTop: 16, borderTop: `1px solid ${COLORS.ruleSoft}`, fontSize: 11, color: COLORS.inkMute, fontFamily: FONT_UI, lineHeight: 1.7 }}>
            <strong style={{ color: COLORS.inkSoft, fontWeight: 600, letterSpacing: "0.06em" }}>Method · </strong>
            Age and Type are editorial classifications inferred from plot summary, scene count, and themes. Reads = StoryView events. "Compared to peers" ranks within the (age × type) cell, then across the type as a whole.
          </div>
        </section>
      </main>
    </>
  );
}

function BedtimeTab({ data }) {
  const bedtimeStories = useMemo(
    () => data.stories.filter(s => s.isBedtimeStory).sort((a, b) => b.bedtimeShare - a.bedtimeShare),
    [data.stories]
  );
  const allByShare = useMemo(
    () => [...data.stories].filter(s => s.reads >= 5).sort((a, b) => b.bedtimeShare - a.bedtimeShare),
    [data.stories]
  );

  const [selectedId, setSelectedId] = useState(bedtimeStories[0]?.id);
  const selected = useMemo(
    () => data.stories.find(s => s.id === selectedId) || bedtimeStories[0],
    [data.stories, selectedId, bedtimeStories]
  );
  const selectedBadge = selected ? bedtimeBadgeStyle(selected.bedtimeClass) : bedtimeBadgeStyle("insufficient");

  // Build bedtime-only aggregate hourly
  const bedtimeAggregate = useMemo(() => {
    const out = Array(24).fill(0);
    bedtimeStories.forEach(s => s.hourly.forEach((v, h) => { out[h] += v; }));
    return out;
  }, [bedtimeStories]);

  const summary = data.bedtimeSummary;
  const totalReadsAll = data.totals.totalReads;
  const bedtimePctOfAllReads = totalReadsAll > 0 ? (summary.totalReads / totalReadsAll) : 0;
  const strongCount = data.stories.filter(s => s.bedtimeClass === "strong").length;
  const leaningCount = data.stories.filter(s => s.bedtimeClass === "leaning").length;

  return (
    <main style={{ maxWidth: 1320, margin: "0 auto", padding: "32px 32px 60px" }}>
      <SectionHead title="Bedtime Stories" italic="what gets read in the quiet hours"
        right={<div style={{ fontSize: 11, fontFamily: FONT_MONO, color: COLORS.inkMute, letterSpacing: "0.08em" }}>
          {summary.count} BEDTIME · {data.stories.length} TOTAL
        </div>} />
      <Ornament />

      {/* Headline insight */}
      <div style={{ marginTop: 24, padding: "32px 36px", background: COLORS.surface, border: `1px solid ${COLORS.rule}`, borderRadius: 2 }}>
        <div style={{ fontSize: 10, fontFamily: FONT_UI, letterSpacing: "0.2em", textTransform: "uppercase", color: COLORS.inkMute, marginBottom: 8 }}>
          The bedtime market
        </div>
        <div style={{ display: "flex", alignItems: "baseline", gap: 16, flexWrap: "wrap" }}>
          <div className="serifnum" style={{ fontFamily: FONT_LATIN, fontSize: 64, fontWeight: 500, color: COLORS.burgundy, lineHeight: 1, letterSpacing: "-0.03em" }}>
            {(data.bedtimeSummary.bedtimeShareOverall * 100).toFixed(0)}%
          </div>
          <div style={{ fontFamily: FONT_LATIN, fontSize: 18, color: COLORS.ink, lineHeight: 1.5, maxWidth: 580, fontStyle: "italic" }}>
            of all reads happen between <strong style={{ fontStyle: "normal", color: COLORS.burgundy }}>19:00 and 02:00 KSA</strong> — the bedtime window. {summary.count} stories pull a majority of their reads during these hours.
          </div>
        </div>
        <div style={{ marginTop: 18, fontSize: 12, color: COLORS.inkMute, fontFamily: FONT_UI, lineHeight: 1.6 }}>
          A "bedtime story" here is defined behaviorally: a story is bedtime-classified when ≥50% of its reads (with at least 5 total) fall in the 19:00–02:00 KSA window. Strong = ≥60%. The classification combines what readers actually do at night with the content patterns we see in those titles.
        </div>
      </div>

      {/* Classification cards */}
      <div style={{ marginTop: 24, display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 0, border: `1px solid ${COLORS.rule}`, background: COLORS.surface, borderRadius: 2 }}>
        <DetailKpi label="Strong Bedtime" value={strongCount} sub="≥60% in bedtime hours" accent={COLORS.burgundy} primary />
        <DetailKpi label="Bedtime-leaning" value={leaningCount} sub="50–60%" accent={COLORS.blue} />
        <DetailKpi label="Bedtime Reads" value={summary.totalReads.toLocaleString()} sub={`${(bedtimePctOfAllReads * 100).toFixed(0)}% of all reads`} accent={COLORS.sage} />
        <DetailKpi label="Avg Rating" value={summary.avgRating ? summary.avgRating.toFixed(2) : "—"} sub="bedtime stories" accent={COLORS.gold}
          extra={summary.avgRating ? <div style={{marginTop:6}}><StarRow value={summary.avgRating} /></div> : null} />
      </div>

      {/* Bedtime hourly distribution */}
      <div style={{ marginTop: 32 }}>
        <SectionHead title="When the bedtime catalogue is read" italic="hour-of-day · bedtime stories only"
          right={<div style={{ fontSize: 10, fontFamily: FONT_MONO, color: COLORS.inkMute, letterSpacing: "0.1em" }}>UTC · ADD +3 FOR KSA</div>} />
        <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.rule}`, borderRadius: 2, padding: "16px 8px" }}>
          <HourChart hourly={bedtimeAggregate} height={220} color={COLORS.burgundy} />
        </div>
      </div>

      {/* Two-column: list + detail */}
      <div style={{ marginTop: 32, display: "grid", gridTemplateColumns: "minmax(320px, 380px) 1fr", gap: 24 }}>
        <aside style={{ background: COLORS.surface, border: `1px solid ${COLORS.rule}`, borderRadius: 2, display: "flex", flexDirection: "column", maxHeight: "calc(100vh - 60px)" }}>
          <div style={{ padding: "16px 18px 12px", borderBottom: `1px solid ${COLORS.rule}` }}>
            <h3 style={{ margin: 0, fontFamily: FONT_LATIN, fontSize: 16, fontWeight: 500, letterSpacing: "0.02em" }}>
              Ranked by bedtime share
            </h3>
            <div style={{ marginTop: 4, fontSize: 11, fontFamily: FONT_UI, color: COLORS.inkMute }}>
              Click a story for plot analysis →
            </div>
          </div>
          <div className="scrollY" style={{ overflowY: "auto", flex: 1 }}>
            {allByShare.map((s, i) => {
              const active = s.id === (selected && selected.id);
              const badge = bedtimeBadgeStyle(s.bedtimeClass);
              return (
                <button key={s.id} onClick={() => setSelectedId(s.id)} className={`row-hover ${active ? "active" : ""}`}
                  style={{ width: "100%", textAlign: "left", background: "transparent", border: "none",
                    borderBottom: `1px solid ${COLORS.ruleSoft}`, padding: "12px 16px", cursor: "pointer",
                    display: "grid", gridTemplateColumns: "22px 48px 1fr auto", gap: 12, alignItems: "center",
                    borderLeft: active ? `3px solid ${badge.color}` : "3px solid transparent",
                    opacity: s.isBedtimeStory ? 1 : 0.55,
                  }}>
                  <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: COLORS.inkMute }}>{pad2(i + 1)}</span>
                  {s.poster ? (
                    <img src={s.poster} alt="" loading="lazy"
                      onError={(e) => { e.currentTarget.style.visibility = "hidden"; }}
                      style={{ width: 48, height: 64, objectFit: "cover", borderRadius: 3,
                        border: `1px solid ${COLORS.rule}`, background: COLORS.surfaceAlt,
                        boxShadow: active ? `0 2px 6px ${badge.color}22` : "0 1px 2px rgba(42,31,23,0.06)" }} />
                  ) : (
                    <div style={{ width: 48, height: 64, borderRadius: 3, border: `1px dashed ${COLORS.rule}`,
                      background: COLORS.surfaceAlt }} />
                  )}
                  <span style={{ minWidth: 0 }}>
                    <ArabicText size={17} weight={active ? 700 : 600}>{s.title}</ArabicText>
                    <div style={{ marginTop: 3, fontFamily: FONT_MONO, fontSize: 10, color: COLORS.inkMute, letterSpacing: "0.06em" }}>
                      {s.reads} reads · {s.bedtimeReads} at bedtime{s.archetype ? ` · ${s.archetype.split(' · ')[0]}` : ""}
                    </div>
                  </span>
                  <span style={{
                    fontFamily: FONT_MONO, fontSize: 12, fontWeight: 500,
                    color: badge.color, fontVariantNumeric: "tabular-nums",
                  }}>
                    {(s.bedtimeShare * 100).toFixed(0)}%
                  </span>
                </button>
              );
            })}
          </div>
        </aside>

        {/* Detail */}
        {selected ? (
          <section className="fade-up" key={selected.id} style={{ background: COLORS.surface, border: `1px solid ${COLORS.rule}`, borderRadius: 2, padding: "28px 32px" }}>
            {/* Story header */}
            <div style={{ marginBottom: 20 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 10 }}>
                <span style={{
                  fontSize: 10, fontFamily: FONT_MONO, padding: "3px 8px", borderRadius: 999,
                  color: selectedBadge.color, border: `1px solid ${selectedBadge.border}`,
                  letterSpacing: "0.1em", textTransform: "uppercase",
                }}>
                  {selectedBadge.icon} {selectedBadge.label} · {(selected.bedtimeShare * 100).toFixed(0)}%
                </span>
                {selected.archetype && (
                  <span style={{ fontSize: 10, fontFamily: FONT_MONO, color: COLORS.inkSoft, letterSpacing: "0.08em", textTransform: "uppercase", fontStyle: "italic" }}>
                    {selected.archetype}
                  </span>
                )}
              </div>
              <ArabicText size={36} weight={700}>{selected.title}</ArabicText>
              {selected.logline && (
                <p dir="rtl" lang="ar" style={{ marginTop: 10, fontFamily: FONT_ARABIC, fontSize: 16, color: COLORS.inkSoft, lineHeight: 1.7 }}>
                  {selected.logline}

              )}
            </div>

            {/* Tags */}
            {(selected.positiveTags.length > 0 || selected.negativeTags.length > 0) && (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 20 }}>
                {selected.positiveTags.map((t) => (
                  <span key={`p${t}`} dir="rtl" lang="ar" style={{ fontFamily: FONT_ARABIC, fontSize: 13, padding: "3px 10px", border: `1px solid ${COLORS.sage}`, color: COLORS.sage, borderRadius: 999 }}>{t}</span>
                ))}
                {selected.negativeTags.map((t) => (
                  <span key={`n${t}`} dir="rtl" lang="ar" style={{ fontFamily: FONT_ARABIC, fontSize: 13, padding: "3px 10px", border: `1px solid ${COLORS.saffron}`, color: COLORS.saffron, borderRadius: 999 }}>{t}</span>
                ))}
              </div>
            )}

            {/* Metrics row */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))", gap: 0, border: `1px solid ${COLORS.rule}`, borderRadius: 2, marginBottom: 24 }}>
              <DetailKpi label="Reads" value={selected.reads} sub="total" />
              <DetailKpi label="Bedtime" value={selected.bedtimeReads} sub={`${(selected.bedtimeShare*100).toFixed(0)}%`} accent={selectedBadge.color} primary />
              <DetailKpi label="Readers" value={selected.uniqueReaders} sub={selected.uniqueReaders ? `${(selected.reads/selected.uniqueReaders).toFixed(1)}×/reader` : "—"} />
              <DetailKpi label="Rating" value={selected.ratingCount ? selected.avgRating.toFixed(2) : "—"} sub={`${selected.ratingCount} reviews`} accent={COLORS.gold} />

            {/* Plot */}
            {selected.plotSummary && (
              <div style={{ marginBottom: 20 }}>
                <div style={{ fontSize: 10, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: COLORS.inkMute, marginBottom: 8 }}>
                  Plot summary
                </div>
                <p dir="rtl" lang="ar" style={{ margin: 0, fontFamily: FONT_ARABIC, fontSize: 15, color: COLORS.ink, lineHeight: 1.9, padding: "16px 20px", background: COLORS.bg, borderRadius: 2, border: `1px solid ${COLORS.ruleSoft}` }}>

                <div style={{ fontSize: 10, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: selectedBadge.color, marginBottom: 8 }}>

                <div style={{ fontSize: 14, fontFamily: FONT_LATIN, color: COLORS.ink, lineHeight: 1.7 }}>
                  {selected.whyBedtime}

            {/* Why this read count */}
            {selected.whyReads && (
              <div style={{ marginBottom: 16, padding: "16px 20px", background: COLORS.bg, borderLeft: `3px solid ${COLORS.saffron}`, borderRadius: 2 }}>
                <div style={{ fontSize: 10, fontFamily: FONT_UI, letterSpacing: "0.18em", textTransform: "uppercase", color: COLORS.saffron, marginBottom: 8 }}>
                  Why this read count
                </div>
                <div style={{ fontSize: 14, fontFamily: FONT_LATIN, color: COLORS.ink, lineHeight: 1.7 }}>
                  {selected.whyReads}
